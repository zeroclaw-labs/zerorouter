name: Router CI

on:
  pull_request:
    branches: [main]
    paths:
      - "router/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-router.yml"
      - ".github/workflows/router-ci.yml"
  push:
    branches: [main]
    paths:
      - "router/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-router.yml"
      - ".github/workflows/router-ci.yml"

concurrency:
  group: router-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: router
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zerorouter_test
    services:
      postgres:
        image: postgres:16-bookworm@sha256:da788743d2060767375896de4d646f7576f5911461444b372616f19ea61db2ec
        env:
          POSTGRES_DB: zerorouter_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zerorouter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.96.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: router -> target
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked

  workflows:
    name: Workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install and run actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  ${archive}" \
            | sha256sum --check --status
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" \
            .github/workflows/ci.yml \
            .github/workflows/router-ci.yml \
            .github/workflows/deploy-router.yml

  arm64-container:
    name: ARM64 container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3.0.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build ARM64 image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./router
          file: ./router/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=zerorouter-router-arm64
          cache-to: type=gha,scope=zerorouter-router-arm64,mode=max
