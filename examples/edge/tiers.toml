schema_version = 1

# Edge-mode tier catalog: ONE tier, selling the operator's local model for $0.
# This file REPLACES the shipped catalog (ZEROROUTER_TIERS_PATH replaces;
# ZEROROUTER_PROVIDERS_PATH adds) — an edge box serves exactly what its
# operator wrote down. The walkthrough is docs/edge-quickstart.md, which also
# shows the hosted-burst ladder this file deliberately does not ship.
#
# Why both the tier rates and the candidate rates are 0/0/0: the free lane
# (the reserve/settle skip, `api::free_lane_admissible`) takes the tier
# selling at $0 AND every candidate in the route being free — a $0-basis
# candidate on a provider that declares `"settlement": "free"`. A $0 price on
# a provider without that declaration refuses the whole file at load.
#
# Naming rule (enforced at load): a tier id either equals one of its own
# candidate ids — the pin shape used here — or lives in the reserved `zero/*`
# namespace for routing aliases (the quickstart's `zero/burst` ladder).
#
# `local/chat` is the id clients put in the request's "model" field. The
# candidate's `model` is what gets sent upstream — set it to a model id your
# server actually serves (llama.cpp ignores it; Ollama and vLLM do not).

[tiers."local/chat"]

# Sell rate: what a customer of THIS router is billed. $0 on every dimension.
[tiers."local/chat".rates]
input_per_mtok = 0.00
cached_input_per_mtok = 0.00
output_per_mtok = 0.00

[[tiers."local/chat".candidates]]
id = "local/chat"
provider = "local"
model = "qwen3:8b"

# Declare what the model can actually take; selection is mechanical and never
# guesses. An omitted field means UNKNOWN and excludes nothing — say nothing
# rather than writing a number you have not checked.
[tiers."local/chat".candidates.metadata]
context_window = 32768
input_modalities = ["text"]

# Cost basis: what serving this rung costs the operator. $0 — it runs on
# your hardware.
[tiers."local/chat".candidates.rates]
input_per_mtok = 0.00
cached_input_per_mtok = 0.00
output_per_mtok = 0.00

# ---------------------------------------------------------------------------
# RETENTION POSTURE — required. A catalog in which any candidate's provider has
# no resolvable posture does not load, so an unlabelled lane is impossible
# rather than defaulted.
#
# A local rung is the one case where `zero` needs no vendor negotiation: the
# model runs on YOUR hardware, so the arrangement is with yourself and nothing
# leaves the box. That makes it the only lane in any shipped file here that can
# honestly carry the label — and `/v1/models` will sort it above every cloud
# lane because of it.
#
# CONFIRM IT BEFORE YOU SHIP IT. "Runs locally" is not the same claim as
# "retains nothing": llama.cpp, Ollama, and vLLM can all be configured to write
# prompts to a request log, and some distributions do by default. Check your
# server's logging configuration, then set `verified` to the day you checked.
# If you are not sure, write `standard` — a conservative label costs nothing and
# a wrong `zero` is a false statement to a customer about their data.
#
# `source_url` here points at your own runbook rather than a vendor page, and
# `source_sha256` is that document's normalized-text digest, which
# `zerorouter admin retention-drift` prints for you. The mechanism is the same:
# if the runbook changes, someone re-reads it.
[retention.local]
posture = "zero"
description = "Served from the operator's own hardware; prompts and completions are not written to durable storage and never leave the machine."
source_url = "https://example.invalid/runbooks/local-inference-logging"
verified = "2026-08-20"
source_sha256 = "1111111111111111111111111111111111111111111111111111111111111111"
