[package]
name = "zerorouter"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[workspace]
resolver = "2"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "form"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
openidconnect = "4"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rust_decimal = "1.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx-core = { version = "0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "chrono", "migrate", "rust_decimal", "uuid"] }
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["chrono", "migrate", "rust_decimal", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.50", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.0"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.22", features = ["serde", "v4"] }
zeroclaw-api = { git = "https://github.com/zeroclaw-labs/zeroclaw.git", rev = "2c2edecbe59a85a60e026a5e2094fed7e863776e" }
zeroclaw-providers = { git = "https://github.com/zeroclaw-labs/zeroclaw.git", rev = "2c2edecbe59a85a60e026a5e2094fed7e863776e" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
