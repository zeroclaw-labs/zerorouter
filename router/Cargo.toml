[package]
name = "zerorouter"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false
license = "AGPL-3.0-only"

[workspace]
resolver = "2"

[features]
# Test-only upstream substitution: the scriptable fakes in `src/testing.rs`
# plus the constructors that put one behind a candidate or a router. Never
# enabled by `cargo build` — a binary that moves money must not carry a way to
# swap an upstream. `router/tests` turns it on through the self dev-dependency
# below, which Cargo's v2 resolver keeps out of non-test builds.
testing = []

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "form"] }
# Both of the following are needed only by `wire::eventstream`, the decoder for
# AWS's `application/vnd.amazon.eventstream` framing (Bedrock's classic
# `/invoke-with-response-stream`). Neither is a new artifact in the dependency
# graph — `base64` and `crc` were already built transitively (reqwest/oauth2 and
# sqlx respectively) at these exact versions; this promotes them to direct
# dependencies rather than resolving anything new.
#
# Hand-rolling both was considered. Base64 decoding and CRC-32 are each a
# ~25-line loop, and writing them would have avoided touching this file at all.
# They are declared here instead because this is a metering path: a decoder that
# is subtly wrong does not fail loudly, it hands the billing machine a corrupted
# token count. A vetted implementation of each primitive is the cheaper risk,
# and the decoder ABOVE them is where this repo's own tests earn their keep.
base64 = "0.23"
chrono = { version = "0.4", features = ["clock", "serde"] }
# Needed only by `src/gcp_auth.rs`, which mints the short-lived OAuth2 access
# tokens the `vertex` lane dispatches on. Google's OpenAI-compatible surface
# accepts NO long-lived API key ("Only Google Cloud Auth is supported using the
# OpenAI library" — cloud.google.com/vertex-ai/generative-ai/docs/start/openai),
# so a service-account JWT-bearer exchange is the only way in, and RS256 is the
# only signature algorithm Google accepts for it.
#
# Like `base64` and `crc` above, neither of these is a new artifact in the
# dependency graph: `rsa` 0.9.10 and `pkcs8` 0.10.2 were already built
# transitively (via `openidconnect`) at these exact versions, so this promotes
# them to direct dependencies rather than resolving anything new.
#
# Hand-rolling was NOT considered here, unlike the base64/CRC case. RSA
# signing is not a 25-line loop; a subtly wrong PKCS#1 v1.5 padding
# implementation is a security defect rather than a corrupted token count, and
# the failure would be silent in exactly the way that matters least — Google
# would simply reject the assertion, until the day it did not.
rsa = "0.9"
pkcs8 = "0.11"
clap = { version = "4.5", features = ["derive"] }
crc = "3"
futures-util = "0.3"
hex = "0.4"
# PINNED AT 0.12 DELIBERATELY. Dependabot will keep offering 0.13; the answer is
# no until `rsa` ships a stable release on `digest` 0.11, and here is the whole
# argument so it does not have to be re-derived each time.
#
# hmac 0.13 requires `digest` 0.11, which means the hash it is parameterized
# over must be `sha2` 0.11. But `gcp_auth.rs` builds `rsa::pkcs1v15::SigningKey
# <Sha256>` to sign Vertex service-account JWTs, and `rsa` 0.9 — its newest
# STABLE release — is a `digest` 0.10 crate. Moving `sha2` to 0.11 therefore
# fails to compile (verified: 8 trait-bound errors on `HashMarker`/`FixedOutput`
# at gcp_auth.rs:135 and :226), and the only `rsa` that would fix it is
# 0.10.0-rc.18 — a release candidate, on the path that signs a live GCP
# credential.
#
# The alternative is aliasing a second `sha2` major just for HMAC. That
# resolves, and it is still wrong: it adds `digest` 0.11, `sha2` 0.11,
# `crypto-common` 0.2 and `hybrid-array` to a binary that moves money, in
# exchange for nothing. Nothing, precisely: `hmac` 0.12.1 does not LEAVE the
# build either way — `sqlx-postgres` (SCRAM) and `openidconnect` (via
# hkdf/rfc6979/ecdsa) both require it — so the bump would mean two HMAC
# implementations and two SHA-256 implementations compiled in, where today
# there is one of each. 0.12.1 carries no advisory, and this crate's use of it
# is two calls in `src/stripe.rs`.
#
# CORRECTION (sqlx 0.9.0 bump). The paragraph above is now wrong on its
# arithmetic, and the correction is recorded here rather than by rewriting it,
# because how the situation changed is the useful part. `sqlx-postgres` 0.9.0
# moved its SCRAM implementation to `sha2` 0.11 / `hmac` 0.13 / `hkdf` 0.13, so
# the second RustCrypto stack the paragraph refused — `digest` 0.11, `sha2`
# 0.11, `crypto-common` 0.2, `hybrid-array`, plus `cmov` and `ctutils` — is in
# the binary anyway, pulled by a dependency rather than chosen here. Before the
# bump the lockfile held exactly one of each; it now holds two of `sha2`,
# `hmac`, `hkdf`, `digest`, `crypto-common`, and `block-buffer`. `cargo deny`
# still passes (`multiple-versions = "warn"`), and no advisory is involved.
#
# The pin itself is UNCHANGED and still correct: `gcp_auth.rs` builds
# `rsa::pkcs1v15::SigningKey<Sha256>`, `rsa` 0.9 is still a `digest` 0.10
# crate, and its 0.10 is still only a release candidate. What has lapsed is
# only the "in exchange for nothing" argument — the cost it weighed is now
# sunk. Whether that makes bumping this crate's own `hmac` worthwhile is a call
# for the repo owner, not a side effect of a sqlx upgrade; note that it was NOT
# verified to compile, since `stripe.rs` would then need `Sha256` from `sha2`
# 0.11 while `gcp_auth.rs` keeps the 0.10 one.
#
# Revisit when `rsa` 0.10 is stable, and then move the whole RustCrypto stack
# in one commit rather than one crate at a time.
hmac = "0.12"
openidconnect = "4"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
# Needed only by `src/byok.rs`, which seals customers' own provider API keys at
# rest under AES-256-GCM. Like `base64`/`crc` and `rsa`/`pkcs8` above, this is
# not a new artifact in the dependency graph: `ring` 0.17.14 was already built
# transitively (rustls, through the `_tls-rustls-ring-webpki` sqlx feature) at
# this exact version, so this promotes it to a direct dependency rather than
# resolving anything new.
#
# Hand-rolling was not considered, for the reason the `rsa` note above gives and
# more sharply. An AEAD assembled by hand fails silently in the direction that
# matters least — the ciphertext still decrypts, the tag still appears to be
# checked — while the property customers are relying on is simply absent. This
# is also the one place in the crate where a mistake discloses a THIRD PARTY's
# credential: the key belongs to the customer's account with Anthropic or
# OpenAI, not to ZeroRouter, so the blast radius of a defect here reaches past
# this deployment entirely.
ring = "0.17"
rust_decimal = "1.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# The two internal features carry over from 0.8.6 unrenamed and unchanged:
# `_rt-tokio` is still `["tokio", "tokio-stream"]` and
# `_tls-rustls-ring-webpki` is still `["_tls-rustls", "rustls/ring",
# "webpki-roots"]`, so the TLS stack — rustls over ring, verifying against the
# webpki root bundle — is byte-for-byte the one this crate has always built.
#
# `json` is NEW here, and it restores rather than adds. Through 0.8.6
# `serde_json` was a NON-optional dependency of `sqlx-postgres`, so its
# `Type`/`Decode`/`Encode` impls for `serde_json::Value` compiled whether or not
# anything asked for them; 0.9.0 made the dependency `optional = true` and put
# those impls behind this feature. The router reads the JSONB `sell_rates` /
# `basis_rates` columns off `usage_events` — the per-request record of what the
# customer was charged and what it cost us — so without the feature that
# read-back stops compiling. Nothing enters the dependency graph: `serde_json`
# is already a direct dependency above and was already built by `sqlx-postgres`
# at 0.8.6. It is listed on both crates the way every other shared feature here
# is, though `sqlx-postgres/json` alone would forward to `sqlx-core/json`.
sqlx-core = { version = "0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "chrono", "json", "migrate", "rust_decimal", "uuid"] }
sqlx-postgres = { version = "0.9.0", default-features = false, features = ["chrono", "json", "migrate", "rust_decimal", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.50", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.0"
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.22", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1.50", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
zerorouter = { path = ".", features = ["testing"] }
