[package]
name = "zerorouter"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false
license = "AGPL-3.0-only"

[workspace]
resolver = "2"

[features]
# Test-only upstream substitution: the scriptable fakes in `src/testing.rs`
# plus the constructors that put one behind a candidate or a router. Never
# enabled by `cargo build` — a binary that moves money must not carry a way to
# swap an upstream. `router/tests` turns it on through the self dev-dependency
# below, which Cargo's v2 resolver keeps out of non-test builds.
testing = []

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "form"] }
# Both of the following are needed only by `wire::eventstream`, the decoder for
# AWS's `application/vnd.amazon.eventstream` framing (Bedrock's classic
# `/invoke-with-response-stream`). Neither is a new artifact in the dependency
# graph — `base64` and `crc` were already built transitively (reqwest/oauth2 and
# sqlx respectively) at these exact versions; this promotes them to direct
# dependencies rather than resolving anything new.
#
# Hand-rolling both was considered. Base64 decoding and CRC-32 are each a
# ~25-line loop, and writing them would have avoided touching this file at all.
# They are declared here instead because this is a metering path: a decoder that
# is subtly wrong does not fail loudly, it hands the billing machine a corrupted
# token count. A vetted implementation of each primitive is the cheaper risk,
# and the decoder ABOVE them is where this repo's own tests earn their keep.
base64 = "0.23"
chrono = { version = "0.4", features = ["clock", "serde"] }
# Needed only by `src/gcp_auth.rs`, which mints the short-lived OAuth2 access
# tokens the `vertex` lane dispatches on. Google's OpenAI-compatible surface
# accepts NO long-lived API key ("Only Google Cloud Auth is supported using the
# OpenAI library" — cloud.google.com/vertex-ai/generative-ai/docs/start/openai),
# so a service-account JWT-bearer exchange is the only way in, and RS256 is the
# only signature algorithm Google accepts for it.
#
# Like `base64` and `crc` above, neither of these is a new artifact in the
# dependency graph: `rsa` 0.9.10 and `pkcs8` 0.10.2 were already built
# transitively (via `openidconnect`) at these exact versions, so this promotes
# them to direct dependencies rather than resolving anything new.
#
# Hand-rolling was NOT considered here, unlike the base64/CRC case. RSA
# signing is not a 25-line loop; a subtly wrong PKCS#1 v1.5 padding
# implementation is a security defect rather than a corrupted token count, and
# the failure would be silent in exactly the way that matters least — Google
# would simply reject the assertion, until the day it did not.
rsa = "0.9"
pkcs8 = "0.11"
clap = { version = "4.5", features = ["derive"] }
crc = "3"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
openidconnect = "4"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
# Needed only by `src/byok.rs`, which seals customers' own provider API keys at
# rest under AES-256-GCM. Like `base64`/`crc` and `rsa`/`pkcs8` above, this is
# not a new artifact in the dependency graph: `ring` 0.17.14 was already built
# transitively (rustls, through the `_tls-rustls-ring-webpki` sqlx feature) at
# this exact version, so this promotes it to a direct dependency rather than
# resolving anything new.
#
# Hand-rolling was not considered, for the reason the `rsa` note above gives and
# more sharply. An AEAD assembled by hand fails silently in the direction that
# matters least — the ciphertext still decrypts, the tag still appears to be
# checked — while the property customers are relying on is simply absent. This
# is also the one place in the crate where a mistake discloses a THIRD PARTY's
# credential: the key belongs to the customer's account with Anthropic or
# OpenAI, not to ZeroRouter, so the blast radius of a defect here reaches past
# this deployment entirely.
ring = "0.17"
rust_decimal = "1.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx-core = { version = "0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "chrono", "migrate", "rust_decimal", "uuid"] }
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["chrono", "migrate", "rust_decimal", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.50", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.0"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.22", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1.50", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
zerorouter = { path = ".", features = ["testing"] }
