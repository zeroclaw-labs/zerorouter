schema_version = 1

# Fixture catalog for tests/request_path.rs. Kept separate from
# config/tiers.toml so the characterization assertions pin router behavior and
# not the production candidate list, which moves for commercial reasons.
#
# Sell rates are deliberately a clean multiple of the candidate cost bases so
# the settled cost_usd, cost_basis_usd, and margin are all exact decimals, and
# the two candidates of the pair tier price differently so a failover row can
# be told apart from a primary row by its COGS alone.

[tiers."zero/test-pair"]

[tiers."zero/test-pair".rates]
input_per_mtok = 3.00
cached_input_per_mtok = 0.60
output_per_mtok = 6.00

[[tiers."zero/test-pair".candidates]]
id = "openai/primary"
provider = "openai"
model = "upstream/primary"

[tiers."zero/test-pair".candidates.rates]
input_per_mtok = 1.00
cached_input_per_mtok = 0.20
output_per_mtok = 2.00

[[tiers."zero/test-pair".candidates]]
id = "anthropic/secondary"
provider = "anthropic"
model = "upstream/secondary"

[tiers."zero/test-pair".candidates.rates]
input_per_mtok = 1.50
cached_input_per_mtok = 0.30
output_per_mtok = 3.00

[tiers."zero/test-solo"]

[tiers."zero/test-solo".rates]
input_per_mtok = 3.00
cached_input_per_mtok = 0.60
output_per_mtok = 6.00

[[tiers."zero/test-solo".candidates]]
id = "openai/solo"
provider = "openai"
model = "upstream/solo"

[tiers."zero/test-solo".candidates.rates]
input_per_mtok = 1.00
cached_input_per_mtok = 0.20
output_per_mtok = 2.00

# Stage-3b ordering fixture: the tier's table order is NOT its cheapest-first
# order, so a cost-mode reorder is observable as a served-candidate flip while
# balanced traffic keeps serving the table's first rung.

[tiers."zero/test-pricier-first"]

[tiers."zero/test-pricier-first".rates]
input_per_mtok = 3.00
cached_input_per_mtok = 0.60
output_per_mtok = 6.00

[[tiers."zero/test-pricier-first".candidates]]
id = "openai/pricier"
provider = "openai"
model = "upstream/pricier"

[tiers."zero/test-pricier-first".candidates.rates]
input_per_mtok = 2.00
cached_input_per_mtok = 0.40
output_per_mtok = 4.00

[[tiers."zero/test-pricier-first".candidates]]
id = "anthropic/cheaper"
provider = "anthropic"
model = "upstream/cheaper"

[tiers."zero/test-pricier-first".candidates.rates]
input_per_mtok = 1.00
cached_input_per_mtok = 0.20
output_per_mtok = 2.00

# Multimodal admission fixtures (2026-08-21). Three lanes, because the
# capability gate has three outcomes and each needs a lane that isolates it:
# a lane that DECLARES text only (refused), a lane that declares image
# (served), and a lane that declares NOTHING (served — "unknown is never a
# refusal", the rule `ModelMetadata::can_serve` has always followed and the
# one several shipped lanes depend on because their sources disagree).
#
# `zero/test-solo` above is the third case already, so only two are added.

[tiers."zero/test-text-only"]

[tiers."zero/test-text-only".rates]
input_per_mtok = 3.00
cached_input_per_mtok = 0.60
output_per_mtok = 6.00

[[tiers."zero/test-text-only".candidates]]
id = "openai/textonly"
provider = "openai"
model = "upstream/textonly"

[tiers."zero/test-text-only".candidates.metadata]
input_modalities = ["text"]

[tiers."zero/test-text-only".candidates.rates]
input_per_mtok = 1.00
cached_input_per_mtok = 0.20
output_per_mtok = 2.00

[tiers."zero/test-vision"]

[tiers."zero/test-vision".rates]
input_per_mtok = 3.00
cached_input_per_mtok = 0.60
output_per_mtok = 6.00

[[tiers."zero/test-vision".candidates]]
id = "openai/vision"
provider = "openai"
model = "upstream/vision"

[tiers."zero/test-vision".candidates.metadata]
input_modalities = ["text", "image"]

[tiers."zero/test-vision".candidates.rates]
input_per_mtok = 1.00
cached_input_per_mtok = 0.20
output_per_mtok = 2.00

# ---------------------------------------------------------------------------
# RETENTION POSTURE — required: `validate_tier_catalog` refuses a catalog in
# which any candidate's provider has no resolvable posture, so a fixture must
# label its lanes exactly as the shipped catalog does. Fixture values: the URLs
# are unreachable by design and the digests are filler, because no test here
# fetches anything — `admin retention-drift` is what reads these fields, and it
# is exercised against its own fixture.
# ---------------------------------------------------------------------------

[retention.anthropic]
posture = "standard"
description = "Fixture lane: posture declared so the catalog loads."
source_url = "https://example.test/anthropic/retention"
verified = "2026-08-20"
source_sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[retention.openai]
posture = "standard"
description = "Fixture lane: posture declared so the catalog loads."
source_url = "https://example.test/openai/retention"
verified = "2026-08-20"
source_sha256 = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
