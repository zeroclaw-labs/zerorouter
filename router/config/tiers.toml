# ---------------------------------------------------------------------------
# FIREWORKS (added 2026-08-20) — FIVE OPEN-WEIGHT ZERO-RETENTION LANES, PLUS ONE
# CLOSED-WEIGHT LANE THAT SAYS SO.
#
# Six flagships nothing else in this catalog carries, reached over Fireworks'
# OpenAI-compatible chat-completions endpoint. FIVE are open-weights and inherit
# an account whose provider pin is `zero` by Fireworks' PUBLISHED DEFAULT rather
# than by contract or by account setting (`[retention.fireworks]` above, basis 3
# of the rule in this file's header). They are the first zero-retention lanes
# that are not Claude, and the first that are not also purchasable from another
# lane here at a different price.
#
# THE SIXTH, `fireworks/qwen3.8-max`, is closed-weight and therefore outside the
# sentence that pin rests on, so it carries a per-tier `standard` retention
# override — the first in this file. It is the same account and the same key; it
# is NOT the same claim. Read its block at the end of this section before adding
# any further Fireworks lane, because the open/closed distinction decides the
# label and nothing in the dispatch path will notice if you get it wrong.
#
# THIS LANE SHIPS DARK. As of the commit that added it the operator holds no
# Fireworks account and `FIREWORKS_API_KEY` is unset, so #89's dispatchability
# filter hides every tier below from `/v1/models` and from route construction.
# That is the intended state: the lane merges and deploys inert and lights up
# when the key is provisioned. Nothing here needs editing at that point — but
# the infrastructure repo does, because a secret CONTAINER is created from
# config/providers.json automatically while INJECTION into the task is opt-in
# per key (`enabled_provider_keys` in the zerorouter-beta tfvars). A key that
# exists in Secrets Manager but is not in that list leaves these lanes dark with
# no error anywhere.
#
# WHY THE IDS ARE `fireworks/<model>` AND NOT THE VENDOR'S STRING. This file's
# header says the public id IS the vendor's id, and these are the second set of
# lanes where that cannot hold literally — the Bedrock lanes were the first.
# Fireworks' dispatch id is `accounts/fireworks/models/kimi-k3`: it carries two
# slashes, so it cannot be a `{vendor}/{model}` id at all, and it names an
# account path rather than a model. The rule behind the promise still holds:
# the id names the account that actually serves the request, and the vendor's
# exact dispatch string is on the candidate's `model` line, unaltered.
#
# THE ID TRAP, and it is a money one. Fireworks publishes THREE serving paths at
# three different prices, and two of them are reached by a DIFFERENT MODEL ID
# under `accounts/fireworks/routers/` rather than by a parameter:
#
#   Standard  accounts/fireworks/models/<slug>          <- pinned below
#   Fast      accounts/fireworks/routers/<slug>-fast    ~1.5x standard
#   US-only   accounts/fireworks/routers/<slug>-us      ~1.1x standard
#
# (Priority is the exception: same id, `service_tier: "priority"` in the body,
# ~1.25x. Nothing here sends it.) Every rate below is the STANDARD one. Changing
# a candidate's `model` to a `routers/` id without changing its rates sells that
# lane 10-50% below cost on every token, and neither the load-time validator nor
# `catalog-drift` would catch it: the file would still agree with itself, and
# the id it reconciled against would still be the standard one.
#
# PRICING IS PASS-THROUGH, basis == sell, transcribed from Fireworks' own
# serverless price list (https://docs.fireworks.ai/serverless/pricing, read
# 2026-08-20) and independently confirmed on each model's page. No conditional
# bands: Fireworks prices these flat at every prompt size, so there is no
# boundary to declare. Note also that Fireworks' size-band fallback pricing
# ("more than 16B parameters", $0.90/M) does NOT apply to any lane here — every
# one of these has its own per-model row, and the bands cover only models not
# listed individually.
#
# `admin catalog-drift` DOES RECONCILE THESE, unlike the Bedrock lanes. models.dev
# carries Fireworks — under `fireworks-ai`, which is why the provider entry
# declares `source_provider_key` — and it files each model under the SAME full
# `accounts/fireworks/models/<slug>` string this file dispatches, so the join is
# exact with no undated-snapshot fallback in play. Every price below was checked
# against both the vendor's price list and that source and all three agree to
# the cent, so these lanes have a real automated margin check.
#
# METADATA RULE FOR THIS SECTION, and it differs from the rest of the file
# because the evidence does. Elsewhere every value was read from models.dev.
# Here two sources exist — Fireworks' own model pages and models.dev — and they
# do not always agree. The rule applied below: DECLARE a field when the vendor
# and models.dev agree, or when the vendor is merely less precise than models.dev
# (the pages render "1M tokens" where models.dev gives the exact integer); OMIT
