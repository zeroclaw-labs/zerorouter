# MAX OUTPUT IS OMITTED, and this is the familiar tell rather than a gap in the
# research. models.dev gives 512,300 — byte-identical to the context window,
# which is the same signature that disqualified MiniMax M3's figure and
# grok-4.6's. A model cannot in general spend its entire window on completion,
# so a number equal to the window is far more likely to be a field defaulted
# from another than a documented cap. Together publishes no output cap at all,
# so there is no second source to break the tie and nothing is claimed. Close it
# by asking for a 200,000-token completion once a key exists. This id is named
