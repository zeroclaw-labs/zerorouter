# XAI (added 2026-08-20) — THE RUNTIME-ATTESTED ZERO-RETENTION LANES.
#
# Two Grok pins on xAI's own API, reached over its OpenAI-compatible
# chat-completions endpoint, on a team whose ZDR toggle is ON — and, uniquely in
# this catalog, on a lane that re-checks that fact on every single request
# rather than trusting the date on a pin. `[retention.xai]` above carries the
# argument and the vendor's exact words; the short version is that xAI publishes
# `x-zero-data-retention: true|false` on every response and ZeroRouter refuses to
# serve a response that does not say `true`.
#
# THIS LANE SHIPS DARK, exactly as the Fireworks lanes above do and for the same
# reason: `XAI_API_KEY` is unset, so #89's dispatchability filter hides both
# tiers from `/v1/models` and from route construction, and the configuration
# merges and deploys inert rather than going stale in a branch. The secret
# container `zerorouter-beta/providers/xai-api-key` already exists; INJECTION is
# still opt-in per key via `enabled_provider_keys` in the zerorouter-beta tfvars,
# and a key present in Secrets Manager but absent from that list leaves these
# lanes dark with no error anywhere.
#
# ONE EXTRA STEP THESE LANES NEED THAT NO OTHER LANE DOES, and it is the one to
# get wrong: provisioning the key is NOT sufficient. ZDR is a team-level setting
# in the xAI Console, off by default, and the key must belong to a team that has
# it ENABLED. A key from a non-ZDR team will authenticate, dispatch, and then
# fail every request closed on the attestation — correctly, loudly, and in a way
# that reads as an outage rather than as a configuration step nobody took. The
# Console blocks enabling ZDR while the team holds any Files or Collections, so
# that cleanup is part of provisioning too.
#
# THE IDS ARE THE VENDOR'S IDS, unlike the Bedrock and Fireworks sections above.
# `grok-4.6` and `grok-4.3` are exactly what xAI dispatches and what
# `{vendor}/{model}` wants, so this file's original promise holds literally
# here: an OpenRouter user changes the base URL and the key and nothing else.
# Note that OpenRouter itself namespaces these `x-ai/grok-4.6`, so the migration
# is not quite id-for-id from THAT gateway — see the slug note in
# `[retention.xai]`. models.dev files the vendor under `xai`, the same key
# ZeroRouter uses, so no `source_provider_key` is declared and the drift join
# works on the provider key itself.
#
# ALIASES ARE DELIBERATELY NOT PINNED. xAI publishes `grok-4.3-latest` beside
# `grok-4.3`, and `-latest` "is aliased to the latest version". A pin that
# resolves to whatever shipped this morning is not a pin — this file's header
# says a pin never changes model under you — and its price would change without
# an edit here. Both `model` lines below name the stable id.
#
# PRICING IS PASS-THROUGH, basis == sell, and BOTH LANES CARRY A CONDITIONAL
# BAND. xAI reprices at 200,000 PROMPT tokens on every text model it sells, and
# the repricing is the step this file's header describes rather than a marginal
# rate: "requests whose prompt reaches 200k tokens are billed at the higher rate
# for all tokens in the request" (docs.x.ai/docs/models, read 2026-08-20). Every
# dimension exactly doubles. The vendor's own table labels the two rows
# `< 200k prompt tokens` and `≥ 200k prompt tokens`, and the prose verb is
# "reaches" — three independent statements that the boundary is INCLUSIVE, which
# is the `>=` this catalog already implements. That is a happier position than
# the OpenAI and Google bands, where the header records that the vendors
# disagree in writing about the boundary token and `>=` was chosen as the
# markup-not-loss side; here the source actually says so.
#
# Both prices were read from docs.x.ai and independently confirmed against
# models.dev, which carries the same figures and encodes the same band twice
# (`cost.tiers[]` and a legacy `cost.context_over_200k` mirror holding identical
# values). `drift.rs` reads the structured field. All three sources agree to the
# cent on every dimension of both bands, so these lanes have a real automated
# margin check.
#
# ONE THING MODELS.DEV ENCODES MORE LOOSELY THAN THE VENDOR: its band
# discriminator is `{"type": "context", "size": 200000}`, i.e. keyed on CONTEXT,
# while xAI's own prose scopes the trigger to the PROMPT. The two coincide for
# every ordinary request and this catalog counts prompt tokens
# (`ConditionalRate`, `src/provider.rs`), which is the vendor's rule. Noted so a
# later reader does not "fix" the catalog to match the looser encoding.
#
# METADATA: the two-source rule from the Fireworks section applies again, and it
# bites on the same field twice.
#
# - context_window IS declared for both. docs.x.ai and models.dev agree exactly
#   (500,000 and 1,000,000), and both clear the 200k floor the shipped-metadata
#   test asserts.
# - tool_call IS declared for both: xAI's model pages say "Function calling:
#   Yes" and models.dev says `tool_call: true`.
# - input_modalities IS OMITTED on both, and this is the omission most likely to
#   be "fixed" by a later reader, so here is the whole argument. xAI's own model
#   pages say "Modalities: text, image → text" and name jpg/jpeg and png as the
#   supported image types. models.dev says `["text", "image", "pdf"]`. The
#   disagreement is exactly one element wide, and it is not resolvable from
#   either source: xAI's documents path runs through the Files API, which ZDR
#   DISABLES outright, so on THIS lane a PDF may well be unreachable even if the
#   model accepts one elsewhere — which would make models.dev right about the
#   model and wrong about the lane.
#
#   Both available answers were tried and rejected. Declaring `["text","image"]`
#   is defensible on the vendor's authority but reports an ACTIONABLE
#   `input_modalities` METADATA DRIFT row on every `catalog-drift` run, and
#   because this lane ships dark there is no key with which to settle it — an
#   alarm nobody can clear, which is how a report stops being read. Declaring
#   models.dev's list would claim `pdf` on no primary evidence, and a
#   declared-but-wrong modality is a false claim every client acts on.
#
#   So nothing is claimed, per this file's own rule: absence reads as UNKNOWN,
#   which is true, and drift reports it as a non-actionable `undeclared` gap.
#   Both ids are named in NO_IMAGE_INPUT in
#   `every_shipped_model_publishes_what_it_can_take_and_produce` for the same
#   reason `fireworks/minimax-m3` is — they omit the list entirely, not because
#   they take no images. THE COST IS REAL AND IS ACCEPTED KNOWINGLY: a client
#   told nothing assumes no vision, so ZeroClaw will not send images to a model
#   that takes them. One probe with a real key closes this — send an image and a
#   PDF, declare what answers — and it should be done the day the key lands.
# - max_output_tokens IS OMITTED on both, and each omission has two numbers
#   behind it. xAI publishes no per-model output cap at all; its REST reference
#   says only that `max_completion_tokens` "Defaults to 128,000 when unset; set
#   a larger value to allow longer generations". models.dev asserts 500,000 for
#   grok-4.6 — identical to its context window, and suspect on its face for the
#   same reason MiniMax M3's was — and 30,000 for grok-4.3, which cannot be
#   reconciled with a documented default of 128,000 on the same model. Three
#   figures, no two agreeing, so nothing is claimed; both ids are named in
#   `every_shipped_model_publishes_what_it_can_take_and_produce`'s NO_MAX_OUTPUT
#   so the omission is reviewed in a diff rather than inherited. Note this field
#   is published to clients only — the router sizes a request from the CALLER's
