# ---------------------------------------------------------------------------
# GROQ (added 2026-08-22) — THREE ZERO-RETENTION LANES BOUGHT FOR SPEED, AND THE
# FIRST LANES IN THIS FILE WHOSE CONTEXT WINDOW IS UNDER 200,000.
#
# Groq sells latency. Its own model table publishes a tokens-per-second figure
# beside every price, which no other vendor in this file does, and the three
# lanes below run at ~500, ~1000 and ~500 t/s. That is the entire reason to
# carry them: none of these three models is scarce — `openai/gpt-oss-120b` is
# also on Together at the identical $0.15/$0.60 — and what Groq adds is not a
# cheaper token but a faster one.
#
# THREE LANES IS THE WHOLE OF GROQ'S GENERAL-PURPOSE CHAT CATALOG, not a
# selection from it. This is the smallest upstream in the file by a wide margin
# and the shortlist was not a matter of taste; everything held out is held out
# for a stated reason:
#
# - `openai/gpt-oss-safeguard-20b` — a safety CLASSIFIER, priced identically to
#   the `gpt-oss-20b` lane below. It answers "does this content violate a
#   policy", not a user's prompt. Nothing blocks it; it is simply not what a
#   general gateway's customers are naming a model to get.
# - `meta-llama/llama-prompt-guard-2-22m` / `-86m` — same shape, and with
#   512-token windows they could not satisfy any sane context assertion.
# - `minimaxai/minimax-m2.7` — reads "Contact Sales" in BOTH the price and the
#   rate-limit column. This catalog's basis is a published rate card; a lane
#   whose cost is a negotiation has no pass-through basis to record, and a
#   guessed one on a money path is exactly the mistake the header forbids.
# - `groq/compound` and `groq/compound-mini` — agentic SYSTEMS rather than
#   models, publishing no token price at all. They also call built-in web
#   search and code execution, which would carry the prompt outside the
#   envelope `[retention.groq]` describes. Two independent disqualifications.
# - `whisper-large-v3*`, `canopylabs/orpheus-*` — audio in, audio out, priced
#   per hour and per character. Not chat-completions lanes.
# - LLAMA IS GONE, and this is a note for whoever comes looking. Groq's catalog
#   carried `llama-3.3-70b-versatile` and `llama-3.1-8b-instant` and neither
#   appears in any current pricing table; they survive only in the docs'
#   model-migration guidance. models.dev still lists both with prices, which is
#   the one place a reader might reasonably conclude they are still buyable.
#   They are not. Do not add them back from that source alone.
#
# PRICES, all read 2026-08-22 from Groq's own model table at
# console.groq.com/docs/models, the column headed "PRICE PER 1M TOKENS", and all
# three agreeing with models.dev to the cent on both dimensions. models.dev
# files Groq under `groq`, which is ZeroRouter's own key, so unlike Fireworks
# and Together no `source_provider_key` is declared — and that is a coincidence
# of naming rather than a rule, exactly as `providers.rs` says.
#
# THE CACHED RATES COME FROM A PUBLISHED FORMULA, NOT A PUBLISHED NUMBER. Groq's
# prompt-caching page states one blanket rule — "There is a 50% discount for
# cached input tokens" — and prints no per-model cached figure anywhere. Half of
# each input rate is therefore what is recorded below, and models.dev's
# independent per-model figures (0.075, 0.0375, 0.30) agree with that
# arithmetic exactly, which is the triple agreement this file wants.
#
# One caveat that the arithmetic hides, recorded here because it will look like
# an error later: the same page limits caching to `gpt-oss-20b`,
# `gpt-oss-120b` and `gpt-oss-safeguard-20b`, so `qwen/qwen3.6-27b` is NOT a
# cached-eligible model today and its 0.30 below will simply never fire. It is
# declared rather than omitted for two reasons — models.dev publishes it, so
# omitting it would leave `catalog-drift` comparing an implicit 0.60 fallback
# against a source figure of 0.30 and reporting a 2x basis error on a lane that
# has none; and if Groq extends caching to the model, 0.30 is already the right
# number under its own published rule. Nothing is billed on it either way.
#
# TWO METADATA FLOORS MOVED FOR THESE LANES, and the argument is in
# `tests/http.rs` where the exception lists live. Every Groq model has a 131,072
# context window and `qwen/qwen3.6-27b` caps completions at 16,384 — both real,
# both documented by vendor and models.dev alike, and both under assertion
# floors written when this catalog was made entirely of frontier models. The
# floors were split rather than lowered: an ABSENT window or max output still
# fails for every lane, and a small DECLARED one is now a named, reviewed
# exemption. Lowering the numbers would have deleted the guard for everyone.
#
# THESE LANES SHIP DARK. `GROQ_API_KEY` is unset, so #89's dispatchability
# filter hides all three from `/v1/models` and from route construction, and this
# deploys inert. Provisioning is NOT just creating a key: as with xAI, the key
# must belong to an account whose Data Controls have ZDR enabled for Inference,
# or every lane below serves under a `zero` label it does not have. See
# docs/DEPLOY.md.

