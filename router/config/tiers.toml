schema_version = 1

# This file is the sole source of truth for the public catalog, fallback order,
# upstream model IDs, and metering rates. Prices were verified on 2026-07-11.
#
# THE CATALOG HAS ONE KIND OF ENTRY: PINS.
#
# PINS — keyed by the OpenRouter-standard `{vendor}/{model}` id (for example
# `openai/gpt-5.6-luna`, `anthropic/claude-sonnet-5`). You name a model, you get
# that model, priced at what it costs. The public id IS the vendor's id: an
# OpenRouter user migrates by changing only the base URL and key, with no id
# translation, and `/v1/models` reports `owned_by` as the vendor (`openai` /
# `anthropic`), exactly as OpenRouter does. `basis == sell` on every dimension,
# so ZeroRouter earns nothing on the spread; margin comes from the volume
# discounts the OpenAI and Anthropic accounts earn. A pin never changes model
# under you.
#
# THE `zero/*` NAMESPACE IS RESERVED — do not delete this note; it is the
# rationale. Until 2026-08-12 every pin was keyed `zero/<model>` and
# `/v1/models` published BOTH that `zero/*` alias and the concrete
# `{vendor}/{model}` candidate id, two rows per model. The pins are now keyed by
# the vendor/model id directly and the `zero/*` alias is gone. The namespace is
# kept, deliberately, for future ROUTED / INTENT tiers: a `zero/<intent>` that
# names an intent and lets ZeroRouter pick among several candidates. The three
# intent BANDS (`zero/low-cost`, `zero/optimized`, `zero/best`) that once lived
# here were removed on 2026-08-12 — each named an intent but resolved to exactly
# one model, identical to a pin, because the selection machinery they were named
# for is not built (`Balanced` is identity by design, `Success` is stubbed, and
# neither the per-task quality scores `best` implied nor the promotional-rate
# tracking `low-cost` implied are modeled anywhere). They come back when real
# selection lands, at which point a band gains candidates and its sell rate must
# rise to cover the dearest one — a PRICE CHANGE that needs notice, not a quiet
# config edit. Until then a customer names a model by its vendor/model id.
#
# Pricing invariant, enforced at load time by `validate_tier_catalog`
# (`src/config.rs`): no candidate's cost basis may exceed its owning tier's
# sell rate on any dimension, IN EVERY BAND a conditional rate table declares.
# `basis == sell` is the intended shape here and stays legal; only a strictly
# greater basis is rejected.
#
# CONDITIONAL RATES (2026-08-18): a `rates` table may carry
# `[[....rates.conditional]]` blocks, each naming a `min_prompt_tokens`
# threshold and a COMPLETE replacement rate table. Several vendors reprice
# long-context requests, and the repricing is a STEP, not a margin: at or above
# the threshold EVERY dimension reprices for the WHOLE request, so a
# 300,000-token prompt on `openai/gpt-5.6-luna` bills all 300,000 input tokens
# at 0.40 AND its entire completion at 1.80. Nothing is split at the boundary
# and nothing is blended. Before this existed the catalog held one rate per
# dimension and every request past a boundary was billed at a basis ZeroRouter
# does not pay; `admin catalog-drift` reported it as TIERED UPSTREAM and could
# not do anything about it.
#
# Six things to know before editing one:
#
# - `min_prompt_tokens` is a MINIMUM: the comparison is `>=`, so a request
#   measuring exactly the threshold is priced in the band above it. The vendors
#   disagree in writing about that one token — OpenRouter's key name says
#   inclusive, Google's prose says "over" — and drift cannot settle it, because
#   basis and sell use the same comparison and the source publishes only a
#   size. `>=` is the markup-not-loss side. See `ConditionalRate` in
#   `src/provider.rs` for the full argument and how to flip it.
# - It counts PROMPT tokens — input, cached portion INCLUDED, because cached
#   input is a subset of input on this wire and `usage_cost` splits rather than
#   sums it. That is also how the vendors count. Output tokens never enter the
#   comparison, though they do reprice.
# - A band REPLACES the base table; it does not patch it. Input and output are
#   required in every band, and an omitted cached rate falls back to THAT
#   band's input rate, exactly as at the base.
# - The candidate's thresholds and its tier's must be IDENTICAL. A mismatch
#   leaves a band of prompt sizes where one side has repriced and the other has
#   not, which is unbillable, so the loader refuses the whole file.
# - Thresholds must be strictly ascending and above zero, so the file reads in
#   the order it prices in.
# - Admission cannot know a request's prompt-token count, so it RESERVES at the
#   dearest rate any band could charge and settlement releases the difference.
#   Under-reserving would let a customer spend past their balance; over-
#   reserving costs them nothing.
#
# CACHE-WRITE RATES (2026-09-01): a `rates` table may carry
# `cache_write_per_mtok`, the price of a prompt token the upstream both read
# and STORED under a `cache_control` breakpoint. It is the fourth billed
# dimension, beside input, cached input and output.
#
# EVERY VALUE IN THIS FILE IS EXACTLY 1.25 x THAT LANE'S INPUT RATE — Anthropic's
# published multiplier for the 5-minute-TTL cache write, which is the only TTL
# this router requests. Verified against models.dev on 2026-09-01, the same
# source `admin catalog-drift` reconciles against: it publishes `cost.cache_write`
# of 1.25 / 2.50 / 6.25 / 12.50 for haiku-4.5 / sonnet-5 / opus-5 / fable-5,
# matching the four first-party lanes below number for number. The four Bedrock
# lanes are 1.25x their own in-region input rate, which is ALSO 1.10x the
# first-party figure (6.875 = 1.25 x 5.50 = 1.10 x 6.25; 4.125 = 1.25 x 3.30 =
# 1.10 x 3.75; 1.375 = 1.25 x 1.10 = 1.10 x 1.25) — the same one-ratio check the
# Bedrock block header describes for the other three dimensions, arriving at the
# same numbers from two directions.
#
# Anthropic also sells a 1-hour TTL at 2x input. It is NOT transcribed here and
# the request surface refuses `cache_control` carrying a `ttl` by name, because
# a price nobody wrote down is a price this catalog will not charge.
#
# THE KEY'S ABSENCE IS A CAPABILITY DECISION, not an oversight, and it is the
# reason only these eight lanes carry it. A lane that declares no
# `cache_write_per_mtok` REFUSES a client `cache_control` outright
# (`prompt_caching_unsupported`), because selling a dimension at a rate nobody
# transcribed is the one thing this file never does. Adding the key to a lane
# is therefore a product decision as much as a price: it turns prompt caching on
# for that model. Note that the source publishes a cache-write rate for several
# lanes here that deliberately do not declare one — `admin catalog-drift` lists
# them under "cache-write pricing published upstream" as information, never as
# drift.
#
# What has NOT changed is what an omitted key costs: `usage_cost` falls an
# absent cache-write rate back to the INPUT rate, exactly as it does for an
# absent cached rate. So a lane without the key prices bit-for-bit as it did
# before the dimension existed. Adding it to these eight is the change, and it
# raises what those lanes charge for cache-writing tokens by 25% — which is what
# ZeroRouter has been paying for them all along.
#
# Admission reserves at the DEAREST rate any prompt token could carry
# (`RateSchedule::reservation_rates`), so a lane declaring this key holds 25%
# more against the prompt bound and settlement releases the difference. That is
# required rather than cautious: settlement is clamped to the reservation, and a
# hold sized at the input rate could not cover a request that wrote its whole
# prompt into the cache.
#
# `/v1/models` PUBLISHES THE BANDS, as OpenRouter's `pricing.overrides[]`
# keyed on the same `min_prompt_tokens` field name. A price a customer cannot
# see is a price they cannot check, and quoting only the base rate understated
# four of the ten listed models by 2x on exactly the requests where the gap is
# largest. The field is additive — a flat tier's row is byte-identical to what
# it published before — so editing a band here changes what customers are
# QUOTED as well as what they are charged. The two come from one schedule, so
# they cannot disagree.
#
# Concrete candidate ids are unique file-wide and each belongs to exactly one
# tier. A pin's tier id equals its single candidate's id, so the tier and the
# model it pins are named the same thing; a reserved `zero/*` tier (when one
# returns) is a routing alias whose id differs from every candidate's.
#
# Availability: every tier here has ONE upstream, so a tier is exactly as
# available as its provider. There is no in-tier failover until a second
# provider serving the same model class is added back.
#
# MODEL METADATA (2026-08-08): each candidate carries a `[...candidates.metadata]`
# table describing what the model can take and produce, and `/v1/models`
# publishes it. It is here rather than fetched because it is the same kind of
# claim a rate is — static, human-owned, true only because someone checked —
# and it earns the same review a price does.
#
# It exists because omitting it is not free. A client that is told nothing has
# to assume something: ZeroClaw assumes 32,000 tokens and no vision for every
# model it cannot get a window for (`UNCONFIGURED_CONTEXT_WINDOW_FALLBACK`),
# so before this table an agent on sonnet reported `ctx: 11,070/32,000`
# against a real window of 1,000,000 and quietly degraded long-context work.
#
# Metadata attaches to the CANDIDATE, not the tier, because it describes the
# model rather than the price. A tier advertises the narrowest thing its
# candidates can do (minimum limits, shared modalities), so a tier that gains
# a second rung cannot keep advertising the first one's window.
#
# Every field is optional and absence means UNKNOWN, never a default. Deleting
# a line here returns that model to the pre-table behaviour; writing a wrong
# number is worse than writing none, because a client cannot tell a wrong
# claim from a checked one. A declared limit of 0 or an empty modality list is
# refused at load — say nothing by saying nothing.
#
# Every value below was read from models.dev on 2026-08-08 and every one of
# the seven upstreams was found there, so nothing here is inferred. You do not
# have to take that on trust: `zerorouter admin catalog-drift` reconciles this
# table against that same catalog on every CI run, so a window that moves
# upstream is caught the way a price is. They are token counts and capability
# flags, not money: nothing here changes what anyone is billed.
#
# `input_modalities` IS A CLAIM ABOUT THE LANE, NOT ABOUT THE MODEL, AND THE
# TWO DIVERGED (2026-08-21). Read this before "restoring" a modality.
#
# Until 2026-08-21 the compat surface refused EVERY structured content array —
# `contains_unsupported_extensions` admitted only a string or null — so a
# client that read `"pdf"` or `"image"` off a row here and built the request
# that row invited got a flat 400. Fourteen of the twenty-one lanes below
# advertised at least one modality the router would not carry. The gap is now
# closed from BOTH ends, and this is the half that took things away:
#
# - `image` KEPT wherever it was declared. All four wires now decode ZR's
#   `[IMAGE:<url>]` packing into their own native shape (Anthropic image
#   blocks, chat-completions `image_url` parts, Responses `input_image`
#   parts), so an image is carried end to end.
# - `pdf` REMOVED from every lane that declared it (the openai, anthropic,
#   bedrock, google and vertex pins). No wire maps OpenAI's `{"type":"file"}`
#   part, and — checked upstream by upstream on 2026-08-21 — NO provider here
#   accepts one on the endpoint ZeroRouter actually dials: Fireworks' schema
#   defines `text`/`image_url`/`video_url` only and withdrew Document
#   Inlining, AI Studio's OpenAI-compat page documents no file part, and xAI's
#   file attachments are an `input_file` shape bound to `/v1/responses`.
#   Anthropic's own Messages API DOES take PDFs as `document` blocks, so this
#   removal understates the anthropic and bedrock lanes specifically — that is
#   deliberate: the claim is what the LANE carries today, and the router has
#   no `document` mapping. Re-declare it the day one lands, not before.
# - `video` and `audio` REMOVED from the google and vertex pins for the same
#   reason and with less argument: nothing in the router has ever carried
#   either, on any wire.
#
# This is the same rule the xAI lanes below already argue at length — "a
# client that believes it can send an image builds a request that fails" —
# applied in the direction that costs the catalog a capability rather than
# gaining one. `admin catalog-drift` reports `input_modalities` rows against
# models.dev for the lanes above: models.dev describes the MODEL and is right
# about it, while this file describes the lane. That divergence is the honest
# state and should not be closed by re-adding a claim the wire cannot honour.
#
# THE DRIFT COMMAND WAS TAUGHT THE DIFFERENCE (2026-08-21). Those thirteen rows
# were reported as `METADATA DRIFT` and failed the command, which made
# `catalog-drift` permanently red on the state this file had just deliberately
# reached — the exact way an alarm stops being read. They now report as
# `lane narrower`: still printed on every run, so the capability a lane declines
# to carry stays visible and the gap to close the day a wire learns to carry it
# is already on screen, but not actionable, because a lane carrying less than
# its model is a true statement.
#
# THE RELAXATION RUNS ONE WAY ONLY. A lane claiming a modality the model does
# NOT take is still `METADATA DRIFT` and still fails — that is the false
# advertisement this whole section was written to remove, and re-opening it in
# the name of symmetry would undo the work above. Both directions are pinned by
# test in `src/drift.rs`.

# ---------------------------------------------------------------------------
# RETENTION POSTURE (2026-08-20) — what each upstream does with a request after
# it answers it, and the evidence the claim was read from.
#
# ZeroRouter's brand is end-to-end zero retention, and this table is what makes
# that claim checkable rather than decorative. `/v1/models` publishes a posture
# on EVERY row and sorts zero-retention lanes first; the portal and the CLI show
# the same label from the same source.
#
# THE CURRENT STATE (2026-08-21, updated when the Vertex lanes landed; the
# paragraph was corrected once before, the day the Fireworks lanes shipped, when
# it still claimed an empty zero-retention section after Bedrock had landed —
# a stale sentence making a false claim about the product, which is why this
# paragraph is updated in the same commit as any lane that changes it):
# `anthropic`, `openai`, and `google` are ORDINARY API ACCOUNTS and every lane on
# them is `standard`. `bedrock`, `fireworks`, `xai`, and `vertex` are `zero` — on
# two of the three bases below, with `bedrock`, `xai`, and `vertex` sharing
# basis 2 and `fireworks` alone on basis 3 — see each pin. One `fireworks` LANE
# is nonetheless `standard`: `fireworks/qwen3.8-max` overrides the provider pin,
# because it is closed-weight and that pin's evidence covers open models only. A
# provider pin is the default for its lanes, not a guarantee about every row.
#
# `google` AND `vertex` ARE THE SAME MODELS WITH OPPOSITE POSTURES, and that is
# deliberate rather than an oversight to reconcile. They are different Google
# products — the Developer API and Vertex AI — under different data policies,
# and the pins say so at length. See `[retention.vertex]`.
#
# `xai` is the one pin whose basis is re-checked at REQUEST time rather than on a
# date: every response carries an `x-zero-data-retention` attestation the
# dispatch path asserts before serving. Two providers therefore share basis 2
# with very different re-verification loops — see `[retention.xai]`.
#
# THE RULE FOR `posture = "zero"`, and it is not a style preference. A lane may
# be pinned zero-retention only on one of THREE bases, and the third was added
# on 2026-08-20 for Fireworks:
#
#   1. A signed or confirmed zero-data-retention ARRANGEMENT is in force with
#      that provider, covering the account that lane dispatches on.
#   2. The provider ENFORCES zero retention as a setting on that account, with
#      published semantics for what the setting means — and the setting is
#      verified live, not assumed (`bedrock`, via `data_retention_mode: none`;
#      `xai`, via a team-level ZDR toggle re-attested on every response). "Live"
#      is doing real work in that sentence and the two pins read it differently:
#      Bedrock's is a credentialed GET a human runs, xAI's is a header the
#      router asserts before it will serve a single byte.
#   3. The provider's own security documentation states zero retention as the
#      PUBLISHED DEFAULT for all customers on the API surface this lane
#      dispatches on (`fireworks`).
#
#   Not because the vendor offers ZDR to someone else; not because a marketing
#   page says data is not used for training — training and retention are
#   different claims, and every `standard` provider below disclaims training
#   while still retaining. Basis 3 in particular is NOT "a page says something
#   reassuring": it requires a specific, quotable retention statement in the
#   vendor's own security or data-handling documentation, scoped to the surface
#   being dispatched, with the page hash pinned — because for a published
#   default the hash is the only re-verification loop that exists.
#
#   When in doubt the answer is `standard`. A wrong `standard` costs a little
#   marketing; a wrong `zero` is a false statement to a customer about their
#   data. docs/DEPLOY.md carries the full argument for each basis.
#
# Retention is declared per PROVIDER because it is a property of the operator's
# ACCOUNT with that provider — one API key, one arrangement, every model on it.
# A tier may override with its own complete block, and exactly one does:
# `fireworks/qwen3.8-max` publishes `standard` on a `zero` provider (2026-08-20,
# the first use of the mechanism). The reason is worth knowing before writing
# another one, because it is NOT the case the override was designed for. It was
# built for a lane bought under a separate AGREEMENT. This one is a lane the
# provider's own published statement does not COVER: same key, same account, same
# policy page — a scope limit inside the evidence rather than a second contract.
# Both are the same shape in the file (a complete replacement block) and both
# want the same discipline: say what the narrower claim is and why.
#
# `source_sha256` is the SHA-256 of the normalized visible text of `source_url`
# on `verified` (scripts, styles, comments, and tags stripped; whitespace
# collapsed — see `src/retention.rs`). `zerorouter admin retention-drift`
# re-fetches each page and reports a mismatch as "re-verify and re-pin". A
# changed page does NOT mean the posture flipped; it means a human must read it.
# Nothing writes back to this file, ever — same rule as prices.
#
# To change a posture: re-verify against the source, THEN edit the pin. The
# procedure is docs/DEPLOY.md, "Changing a retention posture".
#
# `openrouter_slug` is advisory only, feeding `retention-drift --corroborate`.
# Note `google` maps to `google-ai-studio`, NOT `google-vertex`: ZeroRouter
# reaches Gemini over the Developer API, and OpenRouter's Vertex entry is a
# different product under a different data policy (it reports no prompt
# retention, which would have corroborated a lane nobody here runs).

[retention.anthropic]
posture = "standard"
description = "Anthropic deletes API inputs and outputs from its backend within 30 days; longer only for Usage Policy enforcement or where law requires it."
source_url = "https://privacy.claude.com/en/articles/7996866-how-long-do-you-store-my-organization-s-data"
verified = "2026-08-20"
source_sha256 = "87ca1f39c855689a6b829655ad34d46cc10b5e0d261e41bd138cf465f0710407"
openrouter_slug = "anthropic"

# THE PIN THAT OUTGREW WHOLE-PAGE HASHING, and the narrowing its own comment
# asked for. `developers.openai.com` is a docs app whose rendered page includes
# the whole site navigation, so its visible text moved whenever OpenAI published
# ANY unrelated doc. The note here used to read "EXPECT THIS ONE TO GO RED MOST
# OFTEN" and predicted the fix:
#
#   "if re-pinning this becomes frequent enough to be ignored, narrow the
#    evidence rather than lowering the bar — hash a bounded extract around the
#    retention section [...] Muting the check would be the one unacceptable fix."
#
# It became that frequent: THREE re-pins in roughly two days (2026-08-20 twice,
# 2026-08-21), every one of them a docs deploy that touched nothing about
# retention, with the retention prose itself unchanged throughout. Past that
# rate the false positive IS the failure — an alarm cleared without reading is
# worse than no alarm, because it still looks like one. So the deferred
# narrowing is now implemented and this is its first use.
#
# WHAT IS HASHED NOW: 2,000 characters of normalized text running forward from
# the anchor below, and nothing else. The site navigation renders AHEAD of the
# content, so it is outside the extract by construction and can churn without
# limit. The three commitments this pin's description rests on all sit inside
# that window, verified on 2026-08-21:
#
#   1. "As of March 1, 2023, data sent to the OpenAI API is not used to train
#      or improve OpenAI models (unless you explicitly opt in to share data
#      with us)."
#   2. "By default, abuse monitoring logs are generated for all API feature
#      usage and retained for up to 30 days, unless longer retention is
#      required by law, or is reasonably necessary to protect our services or
#      any third party from harm."
#   3. "Eligible customers may have their customer content excluded from these
#      abuse monitoring logs [...] by getting approved for the Zero Data
#      Retention or Modified Abuse Monitoring controls. Currently, these
#      controls are subject to prior approval by OpenAI."
#
# Item 3 is why `standard` is still the right label and is quoted rather than
# summarized: ZDR here is a thing OpenAI grants on application, not a default,
# and this account does not hold it. The day that changes, this pin does.
#
# THE NARROWING DOES NOT LOWER THE BAR. Inside the window a reworded sentence
# moves the digest exactly as it always did — "30 days" becoming "90 days" is
# still caught. What it stops is the navigation being able to raise an alarm.
# And it cannot fail soft: if the anchor stops appearing exactly once, the
# command reports PAGE CHANGED and offers NO digest to copy, because an
# extractor that has lost its anchor knows nothing about the page. See
# `src/retention.rs`.
[retention.openai]
posture = "standard"
description = "OpenAI retains API inputs and outputs in abuse-monitoring logs for up to 30 days, unless longer retention is required by law; API data is not used to train its models."
source_url = "https://developers.openai.com/api/docs/guides/your-data"
verified = "2026-08-21"
source_sha256 = "8c952bdac87ec2a07c78a08df12b6d65595b4bff7b9fdefabe5fae1c55b4dcf5"
source_extract_anchors = ["Your data is your data."]
openrouter_slug = "openai"

# Google publishes NO retention window for the paid Gemini API — the terms say
# prompts and responses are logged "for a limited period of time" for
# Prohibited Use Policy enforcement and stop there. The description below stays
# qualitative rather than inventing a number: a wrong window is a worse claim
# than an unstated one. (OpenRouter's directory reports 55 days for
# `google-ai-studio`; that is a third party's figure, which is why it appears in
# the corroboration output and not in this description.)
[retention.google]
posture = "standard"
description = "On paid Gemini API quota Google does not use prompts or responses to improve its products, but logs them for a limited, unstated period to detect Prohibited Use Policy violations."
source_url = "https://ai.google.dev/gemini-api/terms"
verified = "2026-08-31"
source_sha256 = "b1bf4b85c1eac7594fd594b8bd2fb2690230c4a92f653dc8179d6ec7e32545ce"
openrouter_slug = "google-ai-studio"

# THE FIRST ZERO-RETENTION LANE (2026-08-20), and the one pin here whose
# evidence is not a vendor's prose about what they generally do.
#
# ZeroRouter's AWS account has `data_retention_mode` set to `none` on BOTH
# Bedrock control planes — the classic one
# (`bedrock.us-east-1.amazonaws.com/data-retention`) and the mantle plane
# (`bedrock-mantle.us-east-1.api.aws/v1/data_retention`) — verified by GET
# returning `{"mode": "none"}` on the date below.
#
# WHY THIS SATISFIES THE `zero` RULE WITHOUT A SIGNED ZDR CONTRACT. The rule
# (docs/DEPLOY.md) asks for a "signed or confirmed zero-data-retention
# arrangement in force with that provider, covering the account that lane
# dispatches on". What backs this pin is stronger than a contract, not weaker:
# it is an ENFORCED CONFIGURATION on the account itself, plus AWS's published
# semantics for the value that configuration holds. A contract is a promise a
# human must honour; this is a setting the platform enforces on every request,
# and AWS states the enforcement is consistent "across the Messages, Chat
# Completions, and Responses APIs" — the mode is not per-call and cannot be
# overridden by a request. AWS further documents that a model requiring
# retention is BLOCKED rather than silently downgraded under this mode, so the
# failure direction is closed: a lane that could not honour zero retention
# returns an error instead of quietly retaining.
#
# The account-level rule still holds and is what makes this pin correct at
# PROVIDER level: `data_retention_mode` is a property of the account (and
# optionally the project), never of a model, so one setting covers every model
# reached on this key — exactly the shape `[retention.<provider>]` describes.
#
# RE-VERIFICATION IS TWO CHECKS, not one, and this is the only pin where the
# second exists. `admin retention-drift` hashes the docs page below, which
# catches AWS REWORDING what `none` means. It cannot catch the account setting
# being changed — no public page states what this account is configured to. The
# live half is therefore a separate, credentialed check:
#
#   curl https://bedrock-mantle.us-east-1.api.aws/v1/data_retention \
#     -H "x-api-key: $BEDROCK_API_KEY"        # expect {"mode":"none"}
#
# and it is wired up as `admin retention-drift --bedrock-live`, opt-in so CI
# stays deterministic without credentials. Run BOTH before re-pinning `verified`.
#
# Note the mode enum has a fourth value, `inherit`, which is the DEFAULT for a
# new account and resolves outward (project -> account -> model default). A GET
# returning `inherit` is not a zero-retention account; only a literal `none` is.
#
# `openrouter_slug` is `amazon-bedrock`, and there is a `google-vertex`-shaped
# trap next to it: OpenRouter also publishes `claude-on-aws`
# (`retainsPrompts: true`, 30 days), which is a DIFFERENT product — Anthropic's
# own managed capacity on AWS, not the operator's Bedrock account. The lane here
# is Bedrock on ZeroRouter's own account, so `amazon-bedrock` is the join.
# Its `retainsPrompts: false` happens to agree with this pin; treat that as
# coincidence rather than corroboration — it describes OPENROUTER's Bedrock
# account, which has its own retention configuration and knows nothing about
# ours. The evidence for this pin is the GET above, not a third party.
[retention.bedrock]
posture = "zero"
description = "AWS Bedrock under account data_retention_mode: none — no request or response data is written to durable storage by AWS or shared with the model provider, enforced across the Messages, Chat Completions, and Responses APIs."
source_url = "https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html"
verified = "2026-08-20"
source_sha256 = "7cb04795622b5f7cac43a5d7a216e699f045da24dfbb84de7998cc5204d0cedf"
openrouter_slug = "amazon-bedrock"

# THE THIRD BASIS FOR A `zero` PIN (2026-08-20): the vendor's PUBLISHED DEFAULT.
#
# The rule in docs/DEPLOY.md named two ways a lane earns this label — a signed
# or confirmed ZDR arrangement, and an enforced setting on the account. Neither
# describes Fireworks, and the gap is not a loophole in the rule but a shape the
# rule had not met: Fireworks does not sell zero retention, negotiate it, or
# expose a switch for it. It is what the platform does for everybody, stated in
# its own security documentation. The rule has been widened to name this third
# basis explicitly; read that section before pinning another vendor this way.
#
# WHAT THE PAGE SAYS, verbatim (docs.fireworks.ai/guides/security_compliance/
# data_handling, read 2026-08-20):
#
#   "Fireworks has Zero Data Retention by default."
#   "Fireworks does not log or store prompt or generation data for any open
#    models, without explicit user opt-in."
#   "Prompt and generation data exist only in volatile memory for the duration
#    of the request."
#   "If prompt caching is active, some prompt data (and associated KV caches)
#    can be stored in volatile memory for several minutes." ... "In either case,
#    prompt and generation data are not logged into any persistent storage."
#   "Fireworks logs metadata (e.g. number of tokens in a request) as required to
#    deliver the service."
#
# The KV-cache sentence is quoted rather than elided because it is the one that
# could be read as a carve-out and is not: it widens the window in VOLATILE
# memory and explicitly re-states that nothing reaches persistent storage.
# Metadata logging is likewise not retention of prompt content — ZeroRouter
# itself keeps token counts, because billing is impossible without them.
#
# WHY THE PAGE HASH IS THE WHOLE SAFEGUARD, and it carries more weight here than
# on any other pin. A contract cannot be revoked silently; an account setting can
# be re-read live (that is `--bedrock-live`). A published default can change for
# everyone with one documentation edit and no notice to anybody — and there is
# nothing to query, because no endpoint reports "this account's retention mode":
# there is no per-account mode. So `admin retention-drift` is not a supplementary
# check for this lane the way it is for Bedrock, it is the ONLY check, and a
# PAGE CHANGED verdict here must be read by a human before it is re-pinned. The
# temptation this pin creates is to paste a fresh digest and move on; doing that
# converts the sole evidence for a customer-facing data claim into a rubber
# stamp.
#
# TWO SCOPE LIMITS THAT BOUND WHAT THIS PIN COVERS, both load-bearing:
#
#   1. "for any open MODELS". The sentence is scoped to open models, and every
#      Fireworks lane that INHERITS this pin is deliberately an open-weights one
#      for exactly that reason. Fireworks also serves closed-weight flagships
#      (Qwen 3.7 Plus, Qwen 3.8 Max). Such a lane may not inherit this pin,
#      because a provider-level `zero` posture would then cover a lane this
#      sentence does not reach — it may only ship with its own per-tier
#      `standard` override, which is what `fireworks/qwen3.8-max` does
#      (2026-08-20). Qwen 3.7 Plus is simply not carried. Adding any further
#      closed-weight Fireworks lane WITHOUT an override would silently extend
#      this pin past its evidence; that is the failure this scope limit exists to
#      name. See the note above the Fireworks tiers.
#   2. THE RESPONSE API IS EXCLUDED, and it is the one real carve-out on the
#      page: it stores conversation data when `store=True`, which is its
#      DEFAULT, with 30-day deletion. ZeroRouter never dials it. These lanes ride
#      the `chat_completions` adapter against /inference/v1/chat/completions
#      (see config/providers.json), which the quoted zero-retention sentences
#      cover. Do not add a Responses-shaped surface to this provider entry
#      without revisiting this pin — it would put a retaining plane under a
#      `zero` label, which is the exact failure the posture mechanism exists to
#      prevent.
#
# THE CORROBORATION IS MEANINGFUL HERE, unlike on the Bedrock pin. OpenRouter's
# directory reports `fireworks` with `retainsPrompts: false`, and because this
# claim is about a DEFAULT that applies to every customer, OpenRouter's account
# and ZeroRouter's are governed by the same statement — so a second party
# reading the same policy and reaching the same answer is genuine agreement. On
# Bedrock the same field describes a different account's private configuration
# and was explicitly discounted. Still advisory, still unable to change an exit
# code; it just means something this time.
[retention.fireworks]
posture = "zero"
description = "Fireworks has zero data retention by default: prompt and generation data exist only in volatile memory — for the duration of the request, or for several minutes when prompt caching holds KV data — and are never written to persistent storage. Only metadata such as token counts is logged."
source_url = "https://docs.fireworks.ai/guides/security_compliance/data_handling"
verified = "2026-08-31"
source_sha256 = "6db0700ed334b8d8de1a932de1d7f7d740c260ecb24ef9421e8381bb4ab3f4ab"
openrouter_slug = "fireworks"

# THE STRONGEST VERIFICATION STORY IN THIS TABLE, and it is worth saying plainly
# rather than leaving a reader to infer it from the fields: this is the only pin
# whose claim is re-checked on EVERY SINGLE REQUEST, by the router, at the
# moment of dispatch. Every other pin here — including both zero-retention pins
# above — is verified by a human on a date, and that date is in the past.
#
# xAI is basis 2 of the three-basis rule in this file's header (an ENFORCED
# SETTING on the operator's account, with published semantics), the same basis
# Bedrock rests on. What is different is the re-verification loop, and the
# difference is a category one rather than a matter of degree:
#
#   bedrock  a credentialed GET a human runs when they think to
#            (`admin retention-drift --bedrock-live`)
#   xai      a header on every response, asserted by the dispatch path before
#            the response is used for anything
#
# So the sentence in docs/DEPLOY.md that called Bedrock "the only one with two
# re-verification steps instead of one" is no longer true, and has been edited.
#
# WHAT THE PAGE SAYS, verbatim (docs.x.ai/developers/faq/security, read
# 2026-08-20, page footer "Last updated: July 27, 2026"):
#
#   "xAI never trains on your API inputs or outputs without your explicit
#    permission."
#   "By default, all API requests and responses are stored on our servers
#    (encrypted at rest) for 30 days for auditing purposes in the event of
#    suspected abuse or misuse."
#   "No storage of prompts: ZDR ensures that API request inputs (i.e., your
#    prompt) and outputs (i.e., the tokens generated by the LLM) are never
#    persisted to disk. The 30-day audit retention described above does not
#    apply to ZDR-enabled teams."
#   "Applied at a team level: If enabled, ZDR is team-wide."
#   "Self-serve: Where available, a team admin can turn it on or off directly
#    from the xAI Console."
#   "Response header: every API response includes an `x-zero-data-retention`
#    header set to "true" or "false", so your application can programmatically
#    confirm whether ZDR is active."
#
# Note the default and the setting are OPPOSITE claims about the same account:
# without ZDR this provider stores prompts and completions for 30 days. That is
# the whole reason the runtime check exists, and it is the sharpest version of
# the risk any `zero` pin carries. The two zero pins above degrade differently
# if their basis evaporates — AWS would have to change an account setting nobody
# else can reach, Fireworks would have to edit a published policy — but here the
# thing standing between this lane and a 30-day retaining upstream is A TOGGLE IN
# A CONSOLE, self-serve, team-wide, that any team admin can flip in four clicks,
# with no notice to anyone and no signal in any catalog. An operator cleaning up
# an account, or enabling the Files API for an unrelated project, turns this
# lane's central claim false without ever touching this repository.
#
# THAT IS WHY THE ATTESTATION IS ASSERTED AND NOT MERELY LOGGED. The dispatch
# path reads `x-zero-data-retention` off every response from this upstream and
# REFUSES the request unless it reads `true` — a missing header fails exactly as
# a `false` one does, because "the upstream did not say" and "the upstream said
# no" are the same state as far as a customer's data is concerned. The declaration
# lives in config/providers.json (`attestation_header` / `attestation_expect`),
# the mechanism in `src/wire/mod.rs` (`ResponseAttestation`), and the customer
# sees a 502 `retention_attestation_failed` naming the guarantee rather than a
# generic upstream failure. Nothing is billed: the walk settles the reservation
# at zero like any other failed upstream.
#
# On STREAMING, which the vendor's page does not address at all: the header
# arrives in the initial HTTP response headers, before the SSE body opens, so
# the assertion happens before a single chunk is forwarded. If a streamed
# response ever omits the header, this lane fails closed on every streamed
# request. That is the correct behaviour for an assumption the vendor has not
# confirmed in writing, and it will be loud rather than quiet.
#
# TWO SCOPE LIMITS, the same shape as the Fireworks pin's:
#
#   1. THE CHAT-COMPLETIONS SURFACE ONLY. xAI's own docs mark
#      `/v1/chat/completions` LEGACY and promote the stateful Responses API
#      (`/v1/responses`) — but that surface stores conversation state, and xAI
#      DISABLES it outright under ZDR along with Files, Collections, Batch, and
#      deferred completions. So the legacy label is not a reason to migrate this
#      lane: the promoted surface is the one ZDR turns off. Do not add a
#      Responses-shaped surface to this provider entry without revisiting this
#      pin.
#   2. THE PIN IS ONLY TRUE WHILE THE CONSOLE TOGGLE IS ON, and unlike every
#      other pin here that is not a statement of trust — it is a statement about
#      what the router checks. If the toggle is off, this lane serves nothing.
#
# `openrouter_slug` IS `xai`, AND THIS PIN IS EXPECTED TO CORROBORATE RED. Both
# halves need saying, because a reader meeting the red row later will otherwise
# reasonably conclude the pin is wrong.
#
# The slug first, because it is a trap of the same family as the `google-vertex`
# and `claude-on-aws` ones above: OpenRouter namespaces xAI's MODELS `x-ai/*`
# (`x-ai/grok-4.6`) while filing the PROVIDER under `xai`. Two spellings of one
# vendor, in one catalog, and the model prefix is the one a reader meets first.
# `xai` is the right one here and was read from the exact document the
# corroboration pass fetches (`api/frontend/v1/all-providers`, 2026-08-20), not
# inferred from the model ids.
#
# What that document says about `xai`: `retainsPrompts: true`, `retentionDays:
# 30`, `training: false`. So `admin retention-drift --corroborate` will report
# this pin as APPEARING TO DISAGREE, and that is the mechanism working, not a
# defect — `src/retention.rs` anticipates exactly this case in
# `Corroboration::appears_to_disagree`. OpenRouter's provider-level record
# describes xAI's DEFAULT posture, which is precisely the 30-day retention this
# pin exists to opt out of. A third party has no way to see a toggle on someone
# else's team, so agreement here would be the surprising outcome.
#
# It is declared rather than omitted BECAUSE the disagreement is informative:
# the row prints the vendor's default (retains, 30 days) beside a `zero` pin,
# which is the most compact possible statement of what this lane's guarantee
# rests on. An omitted slug would have printed nothing and said nothing.
# Advisory either way — corroboration cannot change an exit code — and this is
# the one pin least in need of a second opinion, because it re-verifies itself
# on every request.
[retention.xai]
posture = "zero"
description = "xAI under team-level Zero Data Retention: API request inputs and outputs are never persisted to disk, and the default 30-day encrypted audit retention does not apply. xAI does not train on API data without explicit permission. Uniquely in this catalog the guarantee is re-verified at runtime — every response carries an x-zero-data-retention attestation that ZeroRouter asserts is true before serving, and refuses the request when it is not."
source_url = "https://docs.x.ai/developers/faq/security"
verified = "2026-08-20"
source_sha256 = "5d12c2ffee82495ae0afb019e52ec7ed7ffc3b2ad7c9e8416f11b1b50ef15b75"
openrouter_slug = "xai"

# THE SAME GEMINI MODELS AS `[retention.google]`, ON A DIFFERENT PRODUCT WITH A
# DIFFERENT ANSWER (2026-08-21). Read this pin against that one: they are the
# same weights from the same vendor, and the postures are opposite. That is not
# an inconsistency, it is the entire reason this lane exists.
#
# `google` is the Gemini **Developer API** (`generativelanguage.googleapis.com`),
# an ordinary API key on an ordinary account, where Google logs prompts "for a
# limited period" and publishes no window. `vertex` is **Vertex AI** on the
# operator's own Google Cloud project, where Google publishes a documented,
# operator-controlled path to zero data retention. Same model, same price (see
# the tier section — Vertex's global-endpoint rates are identical to AI Studio's,
# so unlike the Bedrock twins this posture costs the customer nothing), different
# product, different data policy.
#
# BASIS 2 OF THE THREE-BASIS RULE — an ENFORCED CONFIGURATION on the operator's
# own account with published semantics, the same basis Bedrock and xAI rest on.
# It is NOT basis 3: Google's published DEFAULT is not zero retention. Caching is
# on by default and abuse-monitoring prompt logging applies by default to
# accounts on the standard Terms of Service. Zero retention here is something the
# operator must go and configure, which is precisely what basis 2 describes.
#
# WHAT THE PAGE SAYS, verbatim (docs.cloud.google.com/vertex-ai/generative-ai/
# docs/data-governance, read 2026-08-21, page footer "Last updated 2026-08-19"):
#
#   "As outlined in 'Training Restriction' in the Service Terms section of the
#    Service Specific Terms, Google won't use your data to train or fine-tune
#    any AI/ML models without your prior permission or instruction. This applies
#    to all managed models on Gemini Enterprise Agent Platform, including GA and
#    pre-GA models."
#   "By default, Google's published Gemini models cache Customer Data (inputs,
#    outputs, and derived data) in-memory to reduce latency and accelerate
#    responses. This data is stored only in-memory (not at-rest), is isolated at
#    the project level, and has a 24-hour TTL. ... This feature can be disabled
#    at the project level."
#   "Only customers whose use of Google Cloud is governed by the Google Cloud
#    Platform Terms of Service are subject to prompt logging for abuse
#    monitoring. If you are in scope for prompt logging for abuse monitoring and
#    want zero data retention, you can request an exception for abuse
#    monitoring."
#   "Request-response logging: This feature is disabled by default. ... To
#    achieve zero data retention, do not enable this feature."
#
# and from the linked abuse-monitoring page (.../docs/learn/abuse-monitoring,
# same date), the sentence that decides who is in scope:
#
#   "Customers in scope: Only customers whose use of Google Cloud is governed by
#    the Google Cloud Platform Terms of Service. This means that customers with
#    a Google Cloud Master Agreement are exempt from prompt logging for this
#    abuse monitoring by default."
#   "Customer opt-out: Customers may request for an exception by filling out
#    this form. If approved, Google won't store any prompts associated with the
#    approved Google Cloud account."
#
# THE REQUIRED PROJECT CONFIGURATION, and this pin is FALSE without all of it.
# The Bedrock pin documents `mode: none`; this is the same idea with more parts,
# because Google spreads the controls across several features:
#
#   1. IN-MEMORY CACHING DISABLED at the project level:
#        curl -X PATCH -H "Authorization: Bearer $(gcloud auth print-access-token)" \
#          -H "Content-Type: application/json" \
#          https://us-central1-aiplatform.googleapis.com/v1/projects/PROJECT_ID/cacheConfig \
#          -d '{"name":"projects/PROJECT_ID/cacheConfig","disableCache":true}'
#      Note Google's own position is that this cache "does not violate zero data
#      retention" — in-memory only, project-isolated, 24-hour TTL. ZeroRouter
#      disables it anyway. The claim sold here is that nothing is retained, and
#      "retained only in RAM for a day" is a sentence a customer is entitled to
#      not want. Disabling is free, so the stronger posture is the one to take.
#   2. NOT IN SCOPE FOR ABUSE-MONITORING PROMPT LOGGING — by holding a Google
#      Cloud Master Agreement (exempt by default), or by an APPROVED exception
#      via Google's opt-out form. A plain self-serve credit-card project is
#      governed by the Cloud Platform ToS and IS in scope, and its prompts are
#      stored up to 90 days on a classifier hit. **Paying Google is not
#      sufficient; the agreement or the approved exception is.**
#   3. REQUEST-RESPONSE LOGGING NOT ENABLED (off by default, per-model
#      per-project — leave it alone).
#   4. NO GROUNDING with Google Search (3-day logs, undisableable) or Google Maps
#      (30-day). ZeroRouter never sends grounding parameters.
#   5. THE INTERACTIONS API IS NEVER DIALLED. It stores prompts, responses, and
#      conversation state when `store = true`, and `store` DEFAULTS TO TRUE.
#      These lanes ride the `chat_completions` adapter against
#      `.../endpoints/openapi/chat/completions` (config/providers.json), a
#      stateless surface the quoted zero-retention path covers. This is the same
#      carve-out shape as the Fireworks and xAI pins' excluded Responses APIs,
#      and it is the most dangerous of the five because the retaining default is
#      the one you get by not thinking about it. Do not add an Interactions-shaped
#      surface to this provider entry without revisiting this pin.
#
# THE HONEST WEAKNESS, stated plainly because a reader deserves it before they
# trust the label. Item 1 is machine-verifiable and item 5 is a property of this
# repository, but ITEM 2 IS NOT VERIFIABLE FROM ANYWHERE — no Google endpoint
# reports "this account is exempt from abuse logging". It rests on the operator
# knowing which agreement their Google Cloud account is under, or holding an
# approval email. That is the same kind of evidence basis 1 accepts for a signed
# ZDR arrangement, so it is not a new weakness in the rule; it IS a second thing
# that must be true and cannot be re-checked by CI, and it is the reason this
# lane must not be given a credential until a human has confirmed it. See
# docs/DEPLOY.md, "What the operator must do in Google Cloud".
#
# RE-VERIFICATION IS TWO CHECKS, as with Bedrock. `admin retention-drift` hashes
# the page below, catching Google REWORDING what these controls mean. The live
# half is a credentialed GET that reads the account's actual cache setting:
#
#   curl -H "Authorization: Bearer $(gcloud auth print-access-token)" \
#     https://us-central1-aiplatform.googleapis.com/v1/projects/PROJECT_ID/cacheConfig
#     # expect {"name": "projects/PROJECT_ID/cacheConfig", "disableCache": true}
#
# A response WITHOUT `disableCache` is caching enabled — that is the default and
# the field is simply absent — so an operator reading this must not treat a
# missing field as a pass. It is the same trap as Bedrock's `inherit`.
#
# THE CORROBORATION IS FINALLY MEANINGFUL, and this pin is the reason the note
# at the top of this section exists. `[retention.google]` maps to
# `google-ai-studio` and explicitly warns that OpenRouter's `google-vertex` entry
# "is a different product under a different data policy (it reports no prompt
# retention, which would have corroborated a lane nobody here runs)". That lane
# is now run, so the slug is correct here for the first time. Treat its
# agreement as weak evidence even so: OpenRouter's Vertex posture reflects
# OPENROUTER's project configuration, which knows nothing about this one — the
# Bedrock caveat, not the Fireworks one. The evidence for this pin is the page
# below plus the operator's own project.
# INTERIM POSTURE — flips back to "zero" when Google approves the
# abuse-monitoring exception (filed 2026-08-21 for zerorouter-vertex-prod;
# the approval email is the evidence that re-pins it). Every other zero
# precondition is already enforced and verified: cacheConfig.disableCache=true
# read back on 2026-08-21, request-response logging off, no training. The one
# open item is abuse-monitoring scope, and until Google grants the exception a
# flagged prompt CAN be logged on their side for up to 90 days — so the label
# says so. This is also what the operator's exception filing told Google the
# catalog says.
# RE-PINNED 2026-08-21 AFTER A PRODUCT RENAME, not a policy change. Google
# renamed Vertex AI's generative-AI surface to "Gemini Enterprise Agent
# Platform", and `source_url` below now 301-redirects to
# `.../gemini-enterprise-agent-platform/resources/zero-data-retention`. The URL
# is deliberately left as the vertex-ai one: it is the address a human verified
# from, it still resolves, and rewriting a pin's `source_url` to a redirect
# target would quietly change WHICH document the claim cites. If Google ever
# breaks the redirect the command reports UNREACHABLE, which is the correct
# outcome — a pin whose evidence cannot be reached has lost its loop.
#
# ALL FOUR PINNED FACTS RE-READ ON THE RENAMED PAGE (2026-08-21) and every one
# still holds, restructured but not weakened:
#
#   1. TRAINING — "Google won't use your data to train or fine-tune any AI/ML
#      models without your prior permission or instruction. This applies to all
#      managed models [...] including GA and pre-GA models."
#   2. IN-MEMORY CACHE — "cache Customer Data (inputs, outputs, and derived
#      data) in-memory [...] stored only in-memory (not at-rest), is isolated at
#      the project level, and has a 24-hour TTL [...] This feature can be
#      disabled at the project level." (ZeroRouter disables it; the live
#      cacheConfig GET above is the half a page hash cannot check.)
#   3. ABUSE MONITORING — "Google may log prompts to detect potential abuse
#      [...] If you are in scope for prompt logging for abuse monitoring and
#      want zero data retention, you can request an exception for abuse
#      monitoring." GRANTED 2026-08-30: "The Generative AI Services team has
#      approved ZeroClaw Labs for the exception to the prompt logging policy
#      as outlined in the Abuse Monitoring documentation for Google Cloud
#      project number(s) [416940592816]" — and 416940592816 was confirmed by
#      `gcloud projects describe` to be zerorouter-vertex-prod, the exact
#      project this lane dispatches on. This was the one open item that kept
#      the posture `standard`; with it granted, all four facts hold and the
#      pin below says `zero`.
#   4. REQUEST-RESPONSE LOGGING — "This feature is disabled by default."
#
# NARROWED EVIDENCE, and this page needs it more than OpenAI's did: 38,000 of
# its 50,000 normalized characters are the Vertex AI API reference navigation —
# every resource, method and type name in the product — so roughly 76% of the
# whole-page digest was text that is not evidence and changes whenever Google
# ships an API. Three anchors, one per region the four facts live in (1 and 3
# share a window), 2,000 characters forward from each.
#
# The anchors are apostrophe-free on purpose: the page writes "won't" with a
# straight quote today, and a CMS switching to a curly one would redden the pin
# for a typographic change. They are also matched CASE-SENSITIVELY, which is why
# the training anchor is the prose and not the "Training restriction" heading —
# that heading sits directly above a quotation of the contractual term
# "Training Restriction", so case-insensitive matching would find it twice and
# report an ambiguous anchor on a page nobody had touched.
[retention.vertex]
posture = "zero"
description = "Vertex AI on ZeroRouter's dedicated Google Cloud project with zero data retention enforced end to end: Google approved the project's abuse-monitoring (prompt logging) exception on 2026-08-30, request-response logging is disabled and re-verified against the live project configuration, no context caching is used, and Google does not train on customer data."
source_url = "https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/zero-data-retention"
verified = "2026-08-30"
source_sha256 = "4f53b20a6c4e9810bcb035db83b997b604720cd21598e6f35341e63d1aaaeeca"
source_extract_anchors = [
  "use your data to train or fine-tune any AI/ML models",
  "Request-response logging",
  "In-memory data caching",
]
openrouter_slug = "google-vertex"

# BASIS 2 AGAIN — AN ENFORCED ACCOUNT SETTING — BUT WITHOUT xAI'S SAFETY NET.
# Read this pin against `[retention.xai]` above, because the two rest on the
# same basis and are NOT equally well guarded, and the difference is the whole
# reason this comment is long.
#
# Groq's Zero Data Retention is a toggle in the account's Data Controls, flipped
# by an organization admin, exactly the shape of xAI's team-level switch. What
# Groq does NOT publish is any per-response attestation, so there is nothing for
# the dispatch path to assert and this lane is verified the ordinary way: a
# human read the page on `verified`, and `retention-drift` re-reads it.
#
# THAT ABSENCE WAS CHECKED, NOT ASSUMED (2026-08-22). Groq's docs embed their
# own OpenAPI document, and the only response header it declares anywhere is
# `Transfer-Encoding`; the sole occurrence of the token "zero-data-retention" in
# the page source is the HTML anchor id of the heading below, and the
# `x-groq-metadata` / `x-groq-meta` keys that look like headers are OpenAPI
# vendor extensions carrying documentation examples. If Groq ever ships a real
# one, wire `attestation_header` / `attestation_expect` in providers.json and
# this lane gains xAI's per-request guarantee for free.
#
# WHAT THE PAGE SAYS, verbatim (console.groq.com/docs/your-data, read
# 2026-08-22):
#
#   "By default, Groq does not retain customer data for inference requests."
#   "We may temporarily log inputs and outputs only when: Troubleshooting
#    errors that degrade platform reliability, or Investigating suspected abuse
#    (e.g. rate-limit circumvention)."
#   "These logs are retained for up to 30 days, unless legally required to
#    retain longer. You may opt out of this storage in Data Controls settings"
#   "All customers may enable Zero Data Retention (ZDR) in Data Controls
#    settings. When ZDR is enabled, Groq will not retain customer data for
#    system reliability and abuse monitoring. As noted above, this also means
#    that features that rely on data retention to function will be disabled.
#    Organization admins can decide to enable ZDR globally or on a per-feature
#    basis at any time"
#   "All customer data is retained in Google Cloud Platform (GCP) buckets
#    located in the United States."
#
# and from the page's summary table, the row that decides this lane, because it
# names the exact endpoint providers.json dials:
#
#   Inference | /openai/v1/chat/completions ... | System reliability and abuse
#   monitoring | Up to 30 days | ZDR Eligible: Yes
#
# SO THE DEFAULT IS NOT GOOD ENOUGH AND THE TOGGLE IS THE ENTIRE CLAIM. Groq's
# default already says it does not retain inference data, which is why it is
# tempting to call this basis 3 and stop. It is not basis 3, because the same
# page carves out a path back to thirty days of stored prompts and completions
# whenever Groq decides it is troubleshooting or investigating abuse — a
# condition the customer cannot observe and ZeroRouter cannot query. ZDR is what
# closes that carve-out. A key on an account without it authenticates, serves,
# and silently sells a thirty-day-eligible lane under a `zero` label.
#
# "GLOBALLY OR ON A PER-FEATURE BASIS" IS THE SHARP EDGE. Groq's toggle is not
# one switch, and a per-feature ZDR that covers Batch but not Inference would
# leave this lane's claim false while the Data Controls page shows ZDR plainly
# enabled. The runbook in docs/DEPLOY.md therefore requires the Inference row
# specifically, not "ZDR is on". Enabling it globally is the recommended form
# because it is the one that cannot be read wrong.
#
# WHAT THIS PAGE DOES NOT SAY, AND WHY THE DESCRIPTION IS SILENT TOO. Every
# other pin in this table states a training posture, because every other
# vendor's page states one. Groq's does not. The only occurrence of the word
# "training" on it is "Model weights and training datasets retained until
# deleted by the customer", which is about data the CUSTOMER uploads to
# fine-tune — it says nothing about whether Groq trains on inference inputs.
#
# So the description above claims nothing about training. A first draft of it
# ended "Groq does not use API data to train models", which is very probably
# true and is what OpenRouter's directory reports, and it was cut because
# neither of those is this pin's evidence. The rule that a `zero` description
# names its basis cuts both ways: a clause the pinned page does not support does
# not belong in a sentence customers read, however likely it is to be right.
# Groq's Terms of Use may well settle it; that is a different document and would
# need its own pin.
#
# `openrouter_slug` is `groq`, AND UNLIKE THE xAI PIN THIS ONE IS EXPECTED TO
# CORROBORATE GREEN — OpenRouter's directory reports `retainsPrompts: false`
# and `training: false` for `groq` (read 2026-08-22 from the same
# `api/frontend/v1/all-providers` document the corroboration pass fetches).
# Worth knowing how little that agreement is worth: a third party cannot see
# this account's Data Controls, so what it is describing is Groq's DEFAULT — the
# very posture that still permits thirty-day abuse logs. It agrees with the pin
# for a reason weaker than the pin's own. Advisory either way.
[retention.groq]
posture = "zero"
description = "Groq under organization-level Zero Data Retention: inputs and outputs are not retained for inference requests, and the temporary reliability and abuse-monitoring logs Groq may otherwise keep for up to 30 days do not apply. Enabling ZDR also disables the batch and fine-tuning features that require storage to work. Unlike the Grok lanes there is no per-response attestation, so this rests on the account setting plus a pinned policy page rather than a runtime check."
source_url = "https://console.groq.com/docs/your-data"
verified = "2026-08-22"
source_sha256 = "d6409f6168ca3f4221a90e3376554c81d3d1b459be164dbb329ccd9dfdd241ce"
source_extract_anchors = [
  "By default, Groq does not retain customer data for inference requests.",
  "All customers may enable Zero Data Retention",
]
openrouter_slug = "groq"

# THE ONLY PIN IN THIS TABLE WHOSE `zero` IS THE VENDOR'S DEFAULT AND WHOSE
# RISK IS THEREFORE INVERTED. Fireworks (basis 3) publishes zero retention as
# what the platform does for everybody. Bedrock, xAI, Vertex and Groq (basis 2)
# require the operator to go and turn something ON. Together is basis 3 with a
# basis-2 hazard bolted to it: the guarantee arrives switched on, and there are
# three organization toggles that TAKE IT AWAY.
#
# That inversion is worth stating because it changes what the runbook is for.
# Everywhere else the provisioning step is "enable the thing or the lane is a
# lie". Here it is "confirm nobody enabled the things", which is the step people
# skip, because a default that is already correct produces no error when it is
# quietly changed later.
#
# WHAT THE PAGE SAYS, verbatim (docs.together.ai/docs/privacy-and-security, read
# 2026-08-22):
#
#   "Together does not store inputs or outputs by default, i.e. it supports zero
#    data retention (ZDR). Temporary caching may be used to improve performance
#    unless otherwise configured."
#   "Data sharing for training other models is opt-in and not enabled by
#    default."
#   "Store prompts and model responses: opt in to storing prompts and outputs
#    for product improvements. Required before you can enable passthrough
#    models."
#   "Allow organization's data for training: opt in to using your organization's
#    data for training models released by Together AI and partners."
#   "Allow passthrough models: opt in to models that forward prompts and
#    responses to third-party providers"
#   "When a request uses an organization's API key, the organization setting is
#    what applies."
#   "Models published by third-party authors (DeepSeek, Qwen, Mistral, etc.) and
#    hosted on Together run on Together's own infrastructure. They do not call
#    out to the model author. The model author has no access to your requests or
#    API calls."
#
# THE PASSTHROUGH CARVE-OUT CLOSES ITSELF, which is the one genuinely reassuring
# thing here and the reason no model below needed to be excluded for it. Every
# other `zero` pin in this file carries a surface that would break it if
# somebody dialled it — Fireworks' and xAI's Responses APIs, Vertex's
# Interactions API — and each is held off by a rule a human has to keep
# remembering. Together's equivalent hazard is the passthrough model, which
# forwards the prompt to a third party under THAT party's policy. But Together
# requires "Store prompts and model responses" to be ON before passthrough can
# be enabled at all, and that toggle being OFF is already a precondition of this
# pin. So the two hazards are the same hazard: satisfy the storage condition and
# passthrough is structurally unavailable, not merely unused. The four lanes
# below are in any case first-party — the last quotation above covers exactly
# the DeepSeek/Qwen/Moonshot/NVIDIA weights they serve.
#
# WHAT IS NOT CLAIMED, and it is in the description rather than buried here
# because a customer is entitled to it: "temporary caching may be used to
# improve performance unless otherwise configured". Together does not say what
# that cache holds, where it lives, or how long it survives, and there is no
# documented switch on the serverless product to turn it off. This is the same
# shape as the in-memory cache the Vertex pin disables — except that there the
# operator CAN disable it and does, and here the sentence is all there is. It
# does not sink the pin, because the vendor states plainly and separately that
# inputs and outputs are not stored; it does mean this pin's `zero` is the
# vendor's word about persistence with an unquantified caching caveat attached,
# and that a reader deserves to see the caveat.
#
# `openrouter_slug` is `together` and this pin should corroborate GREEN
# (`retainsPrompts: false`, `training: false`, read 2026-08-22). Here the
# agreement is worth slightly more than Groq's: what OpenRouter is describing is
# the same published default this pin actually rests on, rather than a default
# the pin exists to escape.
[retention.together]
posture = "zero"
description = "Together does not store inputs or outputs by default — zero data retention is the platform default rather than a setting to negotiate — and this organization leaves all three Privacy toggles off, so prompts and responses are not stored, not used for training, and never forwarded to a third-party passthrough provider. Models run on Together's own infrastructure and the model authors receive nothing. Together does state that temporary caching may be used to improve performance unless otherwise configured, and publishes no further detail on it."
source_url = "https://docs.together.ai/docs/privacy-and-security"
verified = "2026-08-31"
source_sha256 = "c12ecf3bc64c7e4628f19ac0eeee48a778fa362dc8d29beb8b6bf9d1a4c99ea8"
# THREE ANCHORS, AND THE THIRD IS HERE BECAUSE IT WAS MEASURED TO BE MISSING.
# Each anchor hashes 2,000 characters running forward from itself, so the set
# has to be checked against the CLAIMS rather than eyeballed. The first two
# cover the storage default, the training opt-in, all three organization
# toggles, and the passthrough carve-out. They stop short of "Models published
# by third-party authors ... run on Together's own infrastructure. They do not
# call out to the model author" — which sits two sections further down and is
# the sentence that covers the DeepSeek, Qwen, Moonshot and NVIDIA weights every
# lane below actually dials. Without a third anchor that sentence could have
# been rewritten with the pin still reporting UNCHANGED.
#
# The anchors are apostrophe-free on purpose, the same trap the Vertex pin
# documents: this page renders "organization's" and "Together's" with straight
# quotes today and a CMS switching to curly ones would redden the pin for a
# typographic change.
source_extract_anchors = [
  "Together does not store inputs or outputs by default",
  "meaning that Together forwards your prompts and responses directly to the upstream provider",
  "Models published by third-party authors",
]
openrouter_slug = "together"

