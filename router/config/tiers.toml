# GOOGLE (added 2026-08-18). Gemini is reached over Google's OpenAI-compatible
# endpoint, so it rides the `chat_completions` adapter rather than a wire of its
# own; the provider entry carries the full endpoint path, which that adapter
# requires.
#
# Only FLAT-PRICED Gemini models are pinned here. Google prices Gemini Pro in
# CONTEXT TIERS — `gemini-3.1-pro-preview` is $2.00/$12.00 up to 200k input
# tokens and $4.00/$18.00 above it — and this catalog has exactly one rate per
# dimension, so a pin for it would bill a long-context request at half what
# Google charges. `context_window` cannot fence that off: it is descriptive
# metadata published as `/v1/models.context_length`, and it truncates nothing.
# Gemini Pro therefore waits for real tiered-rate support (see the finding
# recorded 2026-08-18 — `openai/gpt-5.6-luna` already carries this exposure).
#
# Rates and metadata below are transcribed from models.dev, the same source
# `admin catalog-drift` reconciles against, so CI checks them the way it checks
# every other pin. Both models are flat-priced there: no `tiers` key, no
# `context_over_200k` key.

