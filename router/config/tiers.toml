# ---------------------------------------------------------------------------
# VERTEX AI (added 2026-08-21) — THE SAME GEMINI MODELS AS THE `google/*` PINS
# ABOVE, ZERO-RETENTION, AND AT THE SAME PRICE.
#
# These three lanes serve the identical weights the `google/*` lanes serve. The
# difference is the product underneath: `google/*` reaches Gemini over the
# Developer API on an ordinary API key, where Google logs prompts for an
# unstated period; `vertex/*` reaches it over Vertex AI on the operator's own
# Google Cloud project, configured for zero data retention. See
# `[retention.vertex]` for the evidence and the exact project configuration the
# posture depends on.
#
# WHY THE IDS ARE `vertex/*` RATHER THAN `google/*`, the same argument the
# Bedrock twins make and worth restating because this is now the second pair of
# twins in the file. A concrete candidate id is unique file-wide, so both lanes
# could not be keyed `google/gemini-3.7-flash` even if we wanted them to be.
# More importantly they are DIFFERENT PRODUCTS: one retains and one does not,
# and a customer must be able to address that difference rather than being
# silently assigned whichever ZeroRouter felt like. `owned_by` publishes as
# `vertex`, naming the account that actually serves the request.
#
# WHAT MAKES THIS PAIR DIFFERENT FROM THE BEDROCK PAIR, and it is the good news:
# THE ZERO-RETENTION LANE IS NOT MORE EXPENSIVE. The Bedrock twins cost 10% more
# than their `anthropic/*` counterparts and that premium is the price of the
# posture. Here the numbers are identical on every dimension. Google's published
# Vertex prices for these models on the GLOBAL endpoint are exactly the Gemini
# Developer API prices — verified 2026-08-21 against
# cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
# (Standard tier, "Global" region rows) and cross-checked against models.dev's
# `google-vertex` entry, which agrees to the cent. So a customer moving from
# `google/gemini-3.7-flash` to `vertex/gemini-3.7-flash` pays the same and stops
# being logged. There is no reason to prefer the `google/*` lane, and the
# ordering `/v1/models` publishes says so: zero-retention lanes sort first.
#
# THE GLOBAL ENDPOINT IS LOAD-BEARING FOR THAT CLAIM, and it is the single most
# likely thing for someone to "fix" later by pinning a region. Google's pricing
# page carries a "Non-global" row for each Flash model at exactly 10% above the
# global one (3.7 Flash: 0.825/4.125 against 0.75/3.75; 3.5 Flash-Lite:
# 0.33/2.75 against 0.30/2.50), and a footnote dating the split: "For non-global
# endpoints, pricing will go into effect for the Generally available Gemini 3 and
# later families of models on July 1, 2026." That date has passed. So dialling
# `us-central1-aiplatform.googleapis.com` instead of the global endpoint would
# raise this lane's cost basis 10% while these tables still said 0.75, and the
# catalog's own invariant (basis <= sell) would NOT catch it — both sides are
# written here, so they would simply both be wrong together and ZeroRouter would
# sell every Vertex token below what Google invoices. `base_url` in
# config/providers.json pins `locations/global` for this reason. If a future
# compliance requirement forces a regional endpoint, the rates below must rise
# by 10% in the same commit.
#
# Note Gemini 3.1 Pro Preview has NO non-global row at all — Google lists it as
# global-only — so the pricing question does not arise for that lane.
#
# THE MODEL IDS CARRY A `google/` PREFIX ON THE WIRE. Vertex's OpenAI-compatible
# surface names publisher models `google/gemini-3.7-flash`, not the bare id the
# Developer API takes. That is why every `model` field below is prefixed while
# the `google/*` tiers' are not — it is the vendor's own id on this surface, not
# a ZeroRouter invention, and dropping the prefix returns a 404 rather than a
# wrong model.
#
# THIS LANE SHIPS DARK, exactly as the Fireworks and xAI lanes did.
# `VERTEX_SERVICE_ACCOUNT` and `VERTEX_PROJECT_ID` are both unset, so #89's
# dispatchability filter hides all three tiers from `/v1/models` and from route
# construction, and the configuration merges and deploys inert. Unlike those
# lanes the credential is NOT a bare key: it is a Google service-account JSON
# blob, exchanged for a one-hour OAuth token on every route build
# (`src/gcp_auth.rs`). docs/DEPLOY.md carries the GCP-side steps — and note that
# the retention posture is a PRECONDITION of provisioning that credential, not a
# consequence of it: minting the key before the project is configured would put
# a lane that claims zero retention in front of a project that does not have it.
#
# Rates and metadata are transcribed from models.dev's `google-vertex` provider,
# which `admin catalog-drift` reconciles against via
# `source_provider_key = "google-vertex"` in config/providers.json. Metadata is
# copied from the `google/*` twins above rather than re-derived: same weights,
# same limits, and a second reading would be a second thing to keep in sync.

[tiers."vertex/gemini-3.7-flash"]

[tiers."vertex/gemini-3.7-flash".rates]
input_per_mtok = 0.75
cached_input_per_mtok = 0.075
output_per_mtok = 3.75

[[tiers."vertex/gemini-3.7-flash".candidates]]
