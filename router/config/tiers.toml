schema_version = 1

# This file is the sole source of truth for the public catalog, fallback order,
# upstream model IDs, and metering rates. Prices were verified on 2026-07-11.
#
# THE CATALOG HAS ONE KIND OF ENTRY: PINS.
#
# PINS — `zero/<model>`. You name a model, you get that model, priced at what
# it costs. `basis == sell` on every dimension, so ZeroRouter earns nothing on
# the spread; margin comes from the volume discounts the OpenAI and Anthropic
# accounts earn. A pin never changes model under you.
#
# Intent BANDS (`zero/low-cost`, `zero/optimized`, `zero/best`) were removed on
# 2026-08-12. Each named an intent and let ZeroRouter pick, but each resolved
# to exactly one model — identical to a pin — because the selection machinery
# they were named for is not built (`Balanced` is identity by design, `Success`
# is stubbed, and neither the per-task quality scores `best` implied nor the
# promotional-rate tracking `low-cost` implied are modeled anywhere). They come
# back when real selection lands, at which point a band gains candidates and
# its sell rate must rise to cover the dearest one — a PRICE CHANGE that needs
# notice, not a quiet config edit. Until then a customer names a model.
#
# Pricing invariant, enforced at load time by `validate_tier_catalog`
# (`src/config.rs`): no candidate's cost basis may exceed its owning tier's
# sell rate on any dimension. `basis == sell` is the intended shape here and
# stays legal; only a strictly greater basis is rejected.
#
# Concrete candidate ids are unique file-wide and each belongs to exactly one
# tier.
#
# Availability: every tier here has ONE upstream, so a tier is exactly as
# available as its provider. There is no in-tier failover until a second
# provider serving the same model class is added back.
#
# MODEL METADATA (2026-08-08): each candidate carries a `[...candidates.metadata]`
# table describing what the model can take and produce, and `/v1/models`
# publishes it. It is here rather than fetched because it is the same kind of
# claim a rate is — static, human-owned, true only because someone checked —
# and it earns the same review a price does.
#
# It exists because omitting it is not free. A client that is told nothing has
# to assume something: ZeroClaw assumes 32,000 tokens and no vision for every
# model it cannot get a window for (`UNCONFIGURED_CONTEXT_WINDOW_FALLBACK`),
# so before this table an agent on sonnet reported `ctx: 11,070/32,000`
# against a real window of 1,000,000 and quietly degraded long-context work.
#
# Metadata attaches to the CANDIDATE, not the tier, because it describes the
# model rather than the price. A tier advertises the narrowest thing its
# candidates can do (minimum limits, shared modalities), so a tier that gains
# a second rung cannot keep advertising the first one's window.
#
# Every field is optional and absence means UNKNOWN, never a default. Deleting
# a line here returns that model to the pre-table behaviour; writing a wrong
# number is worse than writing none, because a client cannot tell a wrong
# claim from a checked one. A declared limit of 0 or an empty modality list is
# refused at load — say nothing by saying nothing.
#
# Every value below was read from models.dev on 2026-08-08 and every one of
# the seven upstreams was found there, so nothing here is inferred. You do not
# have to take that on trust: `zerorouter admin catalog-drift` reconciles this
# table against that same catalog on every CI run, so a window that moves
# upstream is caught the way a price is. They are token counts and capability
# flags, not money: nothing here changes what anyone is billed.

# ---------------------------------------------------------------------------
# PINS — you get this model, at cost, and it does not change.
# ---------------------------------------------------------------------------

[tiers."zero/luna"]

[tiers."zero/luna".rates]
