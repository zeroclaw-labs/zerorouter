schema_version = 1

# This file is the sole source of truth for the public catalog, fallback order,
# upstream model IDs, and metering rates. Prices were verified on 2026-07-11.
#
# Pricing invariant, enforced at load time by `validate_tier_catalog`
# (`src/config.rs`): no candidate's cost basis may exceed its owning tier's
# sell rate on any dimension. Each tier's flagship candidate is priced *at* the
# tier sell rate (0% markup) and margin comes from routing inside the tier to
# cheaper candidates, so basis == sell is the intended flagship shape and stays
# legal; only a strictly greater basis is rejected, because such a candidate
# loses money on every request it serves. A candidate that a tier cannot cover
# belongs in a tier whose sell rates are at or above its basis, not here.

[tiers."zero/low-cost"]

[tiers."zero/low-cost".rates]
