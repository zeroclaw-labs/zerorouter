# ---------------------------------------------------------------------------
# TOGETHER (added 2026-08-22) — FOUR ZERO-RETENTION LANES CHOSEN ENTIRELY BY
# WHAT FIREWORKS ALREADY SELLS.
#
# Together's serverless catalog is the largest this file has met, and it
# overlaps ZeroRouter's existing Fireworks lanes on FIVE models. Not one of the
# five was pinned, because on every one of them Fireworks is the same price or
# cheaper — so a Together twin would add a second row, a second thing to
# re-verify, and nothing a customer could want. The comparison, all figures read
# 2026-08-22 from together.ai/pricing (the "Serverless Inference" table) against
# the Fireworks rates already in this file:
#
#   model              Together in/cached/out   Fireworks in/cached/out   verdict
#   Kimi K3            3.00 / 0.30 / 15.00      3.00 / 0.30 / 15.00       identical
#   MiniMax M3         0.30 / 0.06 / 1.20       0.30 / 0.06 / 1.20        identical
#   GLM-5.2            1.40 / 0.26 / 4.40       1.40 / 0.14 / 4.40        cached 1.9x dearer
#   DeepSeek V4 Pro    1.74 / 0.20 / 3.48       1.74 / 0.145 / 3.48       cached 1.4x dearer
#   DeepSeek V4 Flash  0.14 / 0.03 / 0.28       0.14 / 0.028 / 0.28       cached dearer
#
# Two are identical to the cent and three are dearer on the cached dimension
# only. Together also loses the context comparison on the two that matter —
# Fireworks serves GLM-5.2 at 1,048,575 tokens against Together's 512,000, and
# DeepSeek V4 Pro at 1,000,000 against 512,000. There is no reading on which a
# twin earns its row, so the four below are all models this catalog cannot
# currently sell at all.
#
# WHY THESE FOUR:
#
# - `Qwen/Qwen3.6-Plus` — a 1,000,000-token open-weight model at 0.50/3.00. The
#   catalog's only million-token lanes are Kimi K3 (6x the input price, 5x the
#   output) and the Gemini pair. This is the cheap long-context lane.
# - `moonshotai/Kimi-K2.7-Code` — a coding specialist at roughly a third of Kimi
#   K3's input price and a quarter of its output. Same lab, adjacent generation,
#   and the price gap is the point.
# - `nvidia/nemotron-3-ultra-550b-a55b` — a 550B open-weight flagship with a
#   512,300-token window; nothing else here is from NVIDIA and nothing else is
#   this shape.
# - `deepseek-ai/DeepSeek-V4-Pro-0813` — read the next paragraph before touching
#   this one.
#
# THIS SECTION ANSWERS AN OPEN QUESTION THE FIREWORKS SECTION LEFT. That section
# records, at length, that it pinned the UNDATED `deepseek-v4-pro` id because
# Fireworks' price list carries exactly one DeepSeek V4 Pro row and the 0813
# snapshot has no row in it — publishing 1.32/0.044/3.96 on a model page while
# the list stayed silent. Its instruction was "once a key exists, send one real
# request to each id and read the billing line".
#
# Together settles half of it without a key: it lists `DeepSeek-V4-Pro-0813` in
# its serverless price table at 1.32 input / 0.13 cached / 3.96 output, and
# models.dev agrees to the cent on all three. So the 0813 snapshot IS a
# published, purchasable model at a real rate card — just not at Fireworks —
# and 1.32/3.96 is confirmed by two independent sources as its input and output
# price. Note what is NOT settled: Fireworks' own page said the CACHED rate was
# 0.044 and Together says 0.13, which is a 3x disagreement between two vendors
# about the same weights and is exactly why per-vendor rate cards are pinned per
# lane rather than per model. THE FIREWORKS TIER IS UNCHANGED by this. Nothing
# here licenses moving it to 0813; that still needs the billing-line probe its
# own comment describes.
#
# WHAT ELSE WAS LOOKED AT AND LEFT:
#
# - `Qwen/Qwen3.5-397B-A17B` — the best case for a fifth lane, and it fails an
#   availability check rather than a price one. It is priced on
#   together.ai/pricing (0.60/0.35/3.60) and carried by models.dev, but it is
#   ABSENT from Together's own serverless model list at
#   docs.together.ai/docs/serverless-models, which is the document that says
#   what an API key can actually call. A price for a model you cannot dial is
#   not a lane. Two vendor pages disagreeing about whether a model exists is
#   resolved the conservative way; re-check it if a key ever lands.
# - `thinkingmachines/Inkling` (1.00/0.17/4.05) — a genuinely interesting
#   524,288-token model, held out for a wire reason rather than a commercial
#   one. models.dev reports its input modalities as text, image AND AUDIO, and
#   no ZeroRouter wire carries audio — `tests/http.rs` asserts that no lane may
#   advertise a modality the compat surface refuses. Declaring `["text",
#   "image"]` and dropping the audio claim would be a defensible lane; it would
#   also be this file quietly narrowing a vendor's model, so it waits for a
#   deliberate decision rather than arriving as a side effect of this one.
# - `Qwen/Qwen3.7-Plus` (0.32/1.28, 1,000,000 tokens) — the cheapest long-
#   context model either vendor sells, and omitted only because models.dev has
#   NO ROW for it. `catalog-drift` would report NOT IN SOURCE, which is
#   actionable and fails the nightly job, so pinning it means either an
#   `unreconcilable_reason` on a lane that is merely new, or a red check. Worth
#   revisiting once the source catches up.
# - `Qwen/Qwen3.8-2.4T-A95B` (2.50/0.50/6.25) — the same weights this file
#   already sells as `fireworks/qwen3.8-max` at 2.00/0.25/6.00. Dearer on input
#   and twice the cached rate. Note also that the Fireworks twin needed a
#   per-tier `standard` retention override because it is closed-weight and
#   Fireworks' zero-retention sentence is scoped to open models. Together's is
#   not scoped that way, so this lane could have been `zero` — an interesting
#   asymmetry, and not enough to buy a dearer token.
# - `Prism-ML/Ternary-Bonsai-27B` — free ($0.00 both dimensions). An unbillable
#   rate is a STRUCTURAL fault in this file and would refuse the whole catalog.
# - `thinkingmachines/Inkling-Small`, `meta-models/Muse-Glimmer-30B` — no
#   models.dev row, same NOT IN SOURCE problem as Qwen3.7-Plus.
# - `openai/gpt-oss-120b` / `-20b` — Together sells both. The 120B is the
#   identical 0.15/0.60 that the Groq section above pins, and Groq adds ~500 t/s
#   and a 50% cached discount that Together does not offer at all, so the Groq
#   lane strictly dominates. The 20B is genuinely CHEAPER on Together
#   (0.05/0.20 against Groq's 0.075/0.30) and is the one real cross-vendor
#   trade-off in this pair — a second row for the same weights, slower but a
#   third off. It was left out to keep one model in one place; the catalog
#   already carries Claude twins on `anthropic/*` and `bedrock/*`, so there is
#   precedent for adding it later if anyone wants the cheaper token.
# - `meta-llama/Llama-3.3-70B-Instruct-Turbo` at 1.04/1.04 — an older model
#   priced above several better ones here.
#
# PRICES AND METADATA: rates from together.ai/pricing, context lengths from
# docs.together.ai/docs/serverless-models, both read 2026-08-22, and every
# figure below agreeing with models.dev — which files Together under
# `togetherai`, declared as `source_provider_key` in providers.json because a
# guess landing on a real-but-wrong key reconciles green against somebody
# else's prices.
#
# THESE LANES SHIP DARK. `TOGETHER_API_KEY` is unset. Provisioning here is the
# inverse of every other zero-retention lane: nothing must be switched ON, but
# the three organization Privacy toggles must be confirmed OFF. See
# docs/DEPLOY.md — and read `[retention.together]` above for why a correct
# default is the easiest guarantee in this file to lose silently.

# 1,000,000 tokens at 0.50/3.00. Together's rate card shows a single input price
# with no "(cached)" figure beside it, unlike its Kimi and DeepSeek rows which
# show both, and models.dev likewise records no cache-read rate — so cached
# input bills at the full input rate here. That is stated explicitly below
# rather than left to the header's fallback, because on a money path an
# intentional equality should look intentional.
