# GOOGLE (added 2026-08-18). Gemini is reached over Google's OpenAI-compatible
# endpoint, so it rides the `chat_completions` adapter rather than a wire of its
# own; the provider entry carries the full endpoint path, which that adapter
# requires.
#
# Gemini Pro was HELD BACK from this section when it was written, and the
# reason it was held back is worth keeping: Google prices it in context tiers,
# the catalog had exactly one rate per dimension, and a pin for it would have
# billed every long-context request at half what Google charges.
# `context_window` could not fence that off — it is descriptive metadata
# published as `/v1/models.context_length`, and it truncates nothing. That
# blocker is gone as of the conditional rates documented in this file's header,
# so `google/gemini-3.1-pro-preview` is pinned below with its real 200,000-token
# boundary. Its threshold differs from the OpenAI family's 272,000: these are
# per-vendor facts, never a shared constant.
#
# Rates and metadata below are transcribed from models.dev, the same source
# `admin catalog-drift` reconciles against, so CI checks them the way it checks
# every other pin. The two Flash models are flat-priced there: no `tiers` key.

