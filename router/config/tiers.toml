# ---------------------------------------------------------------------------
# BEDROCK, CLASSIC RUNTIME PLANE (added 2026-08-20) — THE ZERO-RETENTION LANES
# THAT ACTUALLY ANSWER.
#
# Same AWS account as the block above, same `data_retention_mode: none`, same
# `[retention.bedrock]` pin, same `BEDROCK_API_KEY`. A DIFFERENT API PLANE:
# `bedrock-runtime.{region}.amazonaws.com`, AWS's classic `InvokeModel`, which
# the `bedrock` provider entry declares as the `classic_runtime` surface and
# each candidate below selects with `surface = "classic_runtime"`.
#
# These four are live. Verified by real HTTP 200 completions on 2026-08-20
# against all four ids below, on an account whose effective retention mode is
# `none`. They are the ONLY dispatchable Bedrock lanes ZeroRouter has, and
# therefore the first zero-retention lanes a customer can actually buy.
#
# WHERE THE ACCOUNT GATE CUTS, verified model by model on 2026-08-20 against
# this plane. This is the map; do not add a lane above the line without probing
# it first:
#
#   opus 4.5, sonnet 4.5, haiku 4.5   HTTP 200   <- shipped below
#   opus 4.6                          HTTP 200   <- shipped below
#   opus 4.7, opus 4.8                403        <- account not entitled
#   every 5-generation model          403        <- account not entitled
#
# So the gate is not "the mantle plane" and it is not "the new API" — it is a
# per-model-generation entitlement on the ACCOUNT, and it happens to cut between
# 4.6 and 4.7. The 403 reads `not available for this account` and arrives before
# IAM, region, or retention mode matter. Adding `us.anthropic.claude-opus-4-7-v1`
# here because the id looks plausible would ship a lane that 403s on every call,
# which is the exact failure the commented block above records.
#
# WHY 4.5/4.6-GENERATION AND NOT 5. Not a compromise and not temporary — read
# this before "upgrading" these. The two planes host DIFFERENT MODEL
# GENERATIONS. 5-generation Claude is mantle-only (and gated, above).
# 4.5- and 4.6-generation Claude is classic-runtime-only: the mantle plane does
# not host it at all. So these tiers do not become redundant when AWS unlocks the
# account — when that happens the catalog gains the two 5-generation lanes
# ALONGSIDE these four, and a customer picks a generation rather than a plane.
# Deleting these later would remove four models nothing else serves.
#
# WHY THE MODEL IDS CARRY A `us.` PREFIX, and do not remove it. These are
# GEOGRAPHIC INFERENCE PROFILE ids. The bare and dated forms
# (`anthropic.claude-opus-4-5-20251101-v1:0`) are documented In-Region N/A for
# these models on the runtime plane and are refused; the geographic profile is
# the only id that answers. It is also the pricing-relevant fact — see below.
#
# WHY THE WIRE IS ITS OWN ADAPTER. The request BODY is the Anthropic Messages
# body, but four things around it differ and each is an opaque AWS 400 if got
# wrong: the model id rides in the URL path (`/model/<id>/invoke`) instead of
# the body, `anthropic_version = "bedrock-2023-05-31"` is a REQUIRED body field,
# the `anthropic-version` HTTP header belongs to the mantle plane and is not
# part of this operation, and auth is `Authorization: Bearer` rather than
# `x-api-key`. Streaming differs entirely — `/invoke-with-response-stream`
# answers AWS event stream binary framing, not SSE. See
# `src/wire/bedrock_runtime.rs`, whose tests pin every clause.
#
# PRICING IS PASS-THROUGH, basis == sell, AND THESE COST ~10% MORE THAN THE
# GLOBAL CLASS. Same shape of argument as the mantle block's, but a DIFFERENT
# SKU-naming convention, which is the trap: 4.5-generation SKUs are not named
# like 5-generation ones and neither form is guessable from the other.
#
# Read from the AWS Price List API, offer `AmazonBedrockFoundationModels`,
# us-east-1, verified 2026-08-20 (the 4.5-generation models are NOT in the older
# `AmazonBedrock` offer — that offer carries no Claude servicenames at all):
#
#   curl -s --compressed \
#     https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/\
# AmazonBedrockFoundationModels/current/us-east-1/index.json
#
#   servicenames "Claude Opus 4.6 / Opus 4.5 / Sonnet 4.5 / Haiku 4.5 (Amazon
#   Bedrock Edition)". Opus 4.6 and Opus 4.5 price identically:
#
#   usagetype (regional above, global below)            opus 4.6  opus 4.5  sonnet 4.5  haiku 4.5
#   USE1-MP:USE1_InputTokenCount-Units                      5.50      5.50        3.30       1.10
#   USE1-MP:USE1_InputTokenCount_Global-Units               5.00      5.00        3.00       1.00
#   USE1-MP:USE1_OutputTokenCount-Units                    27.50     27.50       16.50       5.50
#   USE1-MP:USE1_OutputTokenCount_Global-Units             25.00     25.00       15.00       5.00
#   USE1-MP:USE1_CacheReadInputTokenCount-Units             0.55      0.55        0.33       0.11
#   USE1-MP:USE1_CacheReadInputTokenCount_Global-Units      0.50      0.50        0.30       0.10
#
#   Opus 4.6's regional SKU ids, for a spot re-check: input GZG423Y4VEBAMFMP,
#   cache read H9AHG8JC5XET4BBQ, output HTCQM6TSYSHDEY34.
#
# The unqualified SKUs' priceDimension descriptions read "... Regional"; the
# `_Global-Units` ones read "... Global". There is no third class.
#
# WHICH CLASS A `us.` PROFILE METERS, and this one IS documented. AWS's
# cross-region-inference guide compares the two directly: geographic
# cross-region inference is "Standard pricing", global cross-region inference is
# "approximately 10% savings" — and Anthropic's own Bedrock page states the same
# from the other side ("Regional endpoints include a 10% pricing premium over
# global endpoints"). A `us.` profile is geographic, so it meters the REGIONAL
# class. Those are the numbers below.
#
# DO NOT "correct" these down to the global figures. That sells every one of
# these lanes below what AWS invoices, on every token. Reaching the global class
# would mean dispatching `global.`-prefixed ids, which is a different routing
# decision with a different data-residency story — not a price fix.
#
# AN INDEPENDENT CHECK THAT THESE NUMBERS ARE THE RIGHT CLASS. Every rate below
# is EXACTLY 1.10x Anthropic's own first-party rate for the same model
# (opus 4.6 and opus 4.5 both 5.00->5.50 and 25.00->27.50, sonnet 4.5
