schema_version = 1

# This file is the sole source of truth for the public catalog, fallback order,
# upstream model IDs, and metering rates. Prices were verified on 2026-07-11.
#
# MVP SHAPE (2026-08-06): ZeroRouter integrates OpenAI and Anthropic directly
# and nothing else. Every tier is therefore a single upstream priced at that
# model's list rate — `basis == sell` on every dimension — and margin comes
# from the volume discounts those two accounts earn, not from a spread the
# customer pays. Aggregator rungs (deepinfra, fireworks, together, minimax)
# and Bedrock were removed with the git dependency that supplied their
# adapters; re-adding any of them restores a routed tier and its failover.
#
# Pricing invariant, enforced at load time by `validate_tier_catalog`
# (`src/config.rs`): no candidate's cost basis may exceed its owning tier's
# sell rate on any dimension. `basis == sell` is the intended shape here and
# stays legal; only a strictly greater basis is rejected, because such a
# candidate loses money on every request it serves.
#
# What this shape gives up, stated plainly: a tier is exactly as available as
# its single upstream. There is no in-tier failover until a second provider
# serving the same model class is added back.
#
# MODEL METADATA (2026-08-08): each candidate carries a `[...candidates.metadata]`
# table describing what the model can take and produce, and `/v1/models`
# publishes it. It is here rather than fetched because it is the same kind of
# claim a rate is — static, human-owned, true only because someone checked —
# and it earns the same review a price does.
#
# It exists because omitting it is not free. A client that is told nothing has
# to assume something: ZeroClaw assumes 32,000 tokens and no vision for every
# model it cannot get a window for (`UNCONFIGURED_CONTEXT_WINDOW_FALLBACK`),
# so before this table an agent on zero/high-end reported `ctx: 11,070/32,000`
# against a real window of 1,000,000 and quietly degraded long-context work.
#
# Every field is optional and absence means UNKNOWN, never a default. Deleting
# a line here returns that model to the pre-table behaviour; writing a wrong
# number is worse than writing none, because a client cannot tell a wrong
# claim from a checked one. A declared limit of 0 or an empty modality list is
# refused at load — say nothing by saying nothing.
#
# Every value below was read from models.dev on 2026-08-08 — the same catalog
# `zerorouter admin catalog-drift` reconciles against — and every one of the
# seven upstreams was found there, so nothing in this table is inferred. They
# are token counts and capability flags, not money: no load-time invariant can
# check them, and nothing here changes what anyone is billed.

[tiers."zero/low-cost"]

[tiers."zero/low-cost".rates]
input_per_mtok = 0.20
cached_input_per_mtok = 0.02
output_per_mtok = 1.20

