#
# PRICED AT 2.00/0.20/10.00, WHICH IS SONNET'S INTRODUCTORY RATE, AND IT LAPSES
# ON 2026-08-31. Until 2026-08-07 this table carried the post-lapse rate
# (3.00/0.30/15.00) as both basis and sell — raised ahead of the calendar so
# the cliff could never withhold the tier. The side effect was a 1.50x markup
# on every sonnet request in the meantime, on tiers that promise cost. We do
# not sell at a profit here, so the rate is now the rate we actually pay.
#
# The trade that buys: on 2026-08-31 the real cost becomes 3.00/0.30/15.00 and
# this table must move the same day, or ZeroRouter sells sonnet BELOW cost and
# loses money on every request. Nothing auto-detects that at runtime — the
# load-time validator only compares this file against itself, and both numbers
# here would still agree. `zerorouter admin catalog-drift` is what catches it,
# and CI runs it daily (.github/workflows/catalog-drift.yml).
