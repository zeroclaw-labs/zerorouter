# ---------------------------------------------------------------------------
# BEDROCK, MANTLE PLANE (added 2026-08-20) — THE ZERO-RETENTION LANES, AND THEY
# ARE CURRENTLY COMMENTED OUT. The reasoning below is the ORIGINAL argument for
# these two tiers and is kept verbatim because it is still the argument for
# them; what changed the same day is that AWS will not serve this account the
# models, which is explained where the commented tiers begin. The live Bedrock
# lanes are the classic-runtime ones in the section after that.
#
# Same two Claude models the `anthropic/*` pins above serve, reached instead
# through the operator's AWS Bedrock account, whose `data_retention_mode` is
# `none` (see `[retention.bedrock]`). The lane exists for the posture, not for
# the price: it costs MORE than the first-party lane and sells at that cost, so
# a customer choosing `bedrock/claude-sonnet-5` over `anthropic/claude-sonnet-5`
# is buying zero retention and paying the premium AWS charges for it.
#
# WHY THE IDS ARE `bedrock/*` RATHER THAN `anthropic/*`. The two lanes serve the
# same weights and could not both be keyed `anthropic/claude-sonnet-5` — a
# concrete candidate id is unique file-wide. More importantly they are different
# products: one retains under Anthropic's 30-day policy and one retains nothing,
# and a customer must be able to ADDRESS that difference. `owned_by` publishes
# as `bedrock` accordingly, naming the account that actually serves the request.
#
# WHY THE WIRE IS THE ANTHROPIC MESSAGES API AND NOT CHAT COMPLETIONS. Bedrock's
# mantle plane does serve an OpenAI-compatible `/v1/chat/completions`, but
# Claude is NOT on it: the Sonnet 5 and Opus 5 model cards mark Chat Completions
# and Responses unsupported, and Messages supported. So these candidates
# dispatch over the SAME `anthropic` adapter the first-party lane uses, pointed
# at `https://bedrock-mantle.{region}.api.aws/anthropic/v1/messages`, which
# takes the identical `x-api-key` + `anthropic-version` headers that wire
# already sends. See `config/providers.json`.
#
# WHY FABLE IS NOT HERE, and do not add it without re-reading this. Bedrock
# publishes `allowed_modes` per model, and `anthropic.claude-fable-5` allows
# ONLY `provider_data_share` — the opposite end of the enum from `none`. Under a
# zero-retention account AWS reports that model `status: unavailable` and blocks
# requests to it rather than quietly retaining, so a `bedrock/claude-fable-5`
# tier would be a lane that cannot serve. It joins this section only if Anthropic
# grants ZDR eligibility for fable-class on Bedrock, at which point its
# `allowed_modes` gains `none` and the model card is the thing to re-read.
#
# PRICING IS PASS-THROUGH, basis == sell — and THESE LANES COST 10% MORE THAN
# THE `anthropic/*` ONES ABOVE. That is correct, it is not a markup, and it is
# the single most likely thing for someone to "fix" later, so here is the whole
# argument.
#
# AWS prices Anthropic models in exactly two on-demand classes. Read them
# yourself from the AWS Price List API, offer `AmazonBedrockFoundationModels`,
# servicename "Claude Sonnet 5 (Amazon Bedrock Edition)" (verified 2026-08-20,
# us-east-1):
#
#   curl -s --compressed \
#     https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/\
# AmazonBedrockFoundationModels/current/us-east-1/index.json
#
#   usagetype                                        sonnet 5   opus 5
#   USE1_input_tokens_global_standard-Units             2.00      5.00
#   USE1_input_tokens_standard-Units                    2.20      5.50
#   USE1_output_tokens_global_standard-Units           10.00     25.00
#   USE1_output_tokens_standard-Units                  11.00     27.50
#   USE1_cache_read_tokens_global_standard-Units        0.20      0.50
#   USE1_cache_read_tokens_standard-Units               0.22      0.55
#
# There is no third class. `_global_standard` is what a GLOBAL cross-region
# inference profile (`global.anthropic.claude-sonnet-5`) meters against; the
# unqualified `_standard` is everything else. The mantle endpoint is in-region
# only — AWS documents cross-region inference as unsupported there and the model
# cards mark the geo and global inference ids N/A for it — so a mantle call
# cannot reach the global class, and `_standard` is what it bills. Those are the
# numbers below.
#
# So the zero-retention lane costs the in-region premium, and the customer pays
# exactly that and no more. Sonnet at 2.20/11.00 here against 2.00/10.00 on the
# `anthropic/*` lane is the price of zero retention, priced through at cost like
# everything else in this file. DO NOT "correct" it to 2.00/10.00: that sells
# this lane below what AWS invoices, on every token.
#
# ONE INFERENCE IS LOAD-BEARING AND IS NOT LITERALLY DOCUMENTED. No AWS sentence
# says "mantle meters usagetype X". It is forced by elimination — two classes
# exist, mantle cannot use the global one — and it is the kind of thing to close
# empirically rather than argue about: after the first real invocation, read the
# Cost and Usage Report line item and confirm the `usagetype` reads
# `..._input_tokens_standard-Units` and not `..._global_standard-Units`. That is
# the operator's post-launch verification step; docs/DEPLOY.md records it.
#
# `admin catalog-drift` DOES NOT RECONCILE THESE TWO TIERS, deliberately, and
# that is a real gap rather than a convenience. models.dev carries Bedrock under
# `amazon-bedrock` and prices the bare id `anthropic.claude-sonnet-5` at 2.00 —
# the GLOBAL rate, under a key that means in-region. Joining to it was
# implemented and then removed: it reported `ok` over a basis 10% under the
# invoice, which is worse than no check, because it is a check that says
# everything is fine. The exemption is declared in `config/providers.json`
# (`unreconcilable_reason`), prints its reason on every drift run, and means
# these rates have NO automated check — re-verify them by hand with the curl
# above when AWS moves anything.
# THE 5-GENERATION MANTLE LANES ARE COMMENTED OUT (2026-08-20, same day they
# were added). DO NOT DELETE THIS BLOCK — uncommenting it is the whole
# re-enable procedure, and the argument for why it is commented rather than
# removed is below.
#
# WHAT HAPPENED. These two tiers were written against the mantle plane and
# shipped believing the account could reach it. It cannot. Every model the
# mantle plane hosts 403s for this AWS account with "not available for this
# account" — an AWS SALES gate on 5-generation Claude, per-account and
# per-model-generation, entirely separate from IAM. The credential is valid, the
# region is right, `data_retention_mode` reads `none`, IAM grants invoke: the
# request is refused before any of that matters.
#
# WHY COMMENTING OUT RATHER THAN LEAVING THEM HIDDEN. #89 made `/v1/models`
# publish only what a deployment can serve, and its filter reads credential and
# region presence. Both are about to be present in production — the deploy
# adopts a task definition carrying BEDROCK_API_KEY — so the filter would have
# PASSED these two lanes and put them back on the storefront, unservable. That
# is #89's incident again, one layer deeper: a credential check cannot see an
# account entitlement, because nothing in the environment records one. The only
# honest place to encode "AWS will not serve this account these models" is here,
# in the file that says what ZeroRouter sells.
#
# THE RE-ENABLE CONDITION, precisely: AWS Sales grants account 161457899654
# access to 5-generation Claude on Bedrock. Verify with a real invocation, not
# with a console page. Then uncomment this block verbatim; nothing else needs to
# change, because everything these tiers depend on is deliberately still in
# place — `[retention.bedrock]` above (same account, same posture, and the
# runtime lanes below rely on it), the `bedrock` entry in `config/providers.json`
# with its mantle `base_url` intact, and the `unreconcilable_reason` that exempts
# every bedrock candidate from `catalog-drift`.
#
# RE-CHECK THE PRICES WHEN YOU UNCOMMENT. They were read on 2026-08-20 and have
# had no automated check since (that is what the exemption costs). The curl is
# in the pricing note below.
#
# [tiers."bedrock/claude-sonnet-5"]
#
# [tiers."bedrock/claude-sonnet-5".rates]
# input_per_mtok = 2.20
# cached_input_per_mtok = 0.22
# output_per_mtok = 11.00
#
# [[tiers."bedrock/claude-sonnet-5".candidates]]
# id = "bedrock/claude-sonnet-5"
# provider = "bedrock"
# # The bare, unprefixed model id. Mantle is in-region only, so the geo (`us.`)
# # and global (`global.`) inference-profile ids the runtime endpoint accepts are
# # documented N/A here — sending one is an error, not a routing preference.
# model = "anthropic.claude-sonnet-5"
#
# [tiers."bedrock/claude-sonnet-5".candidates.metadata]
# context_window = 1000000
# max_output_tokens = 128000
# input_modalities = ["text", "image", "pdf"]
# tool_call = true
#
# [tiers."bedrock/claude-sonnet-5".candidates.rates]
# input_per_mtok = 2.20
# cached_input_per_mtok = 0.22
# output_per_mtok = 11.00
#
# [tiers."bedrock/claude-opus-5"]
#
# [tiers."bedrock/claude-opus-5".rates]
# input_per_mtok = 5.50
# cached_input_per_mtok = 0.55
# output_per_mtok = 27.50
#
# [[tiers."bedrock/claude-opus-5".candidates]]
# id = "bedrock/claude-opus-5"
